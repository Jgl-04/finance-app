<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuenta y Razón</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#A67C27">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cuenta y Razón">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --paper: #EDE6D6;
    --paper-card: #F6F1E4;
    --paper-card-2: #E7DFC9;
    --ink: #21311F;
    --ink-soft: #55645A;
    --ink-faint: #8A9186;
    --gold: #A67C27;
    --gold-soft: #C79A45;
    --income: #55744B;
    --income-bg: #E1E8DB;
    --expense: #92453A;
    --expense-bg: #EDDEDA;
    --line: rgba(33,49,31,0.14);
    --line-strong: rgba(33,49,31,0.32);
    --shadow: 0 1px 2px rgba(33,49,31,0.06), 0 4px 14px rgba(33,49,31,0.07);
    --radius: 14px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    position:relative;
    padding-bottom:88px;
    background-image:
      linear-gradient(var(--paper) 0%, var(--paper) 100%);
  }

  /* ---- Header ---- */
  .topbar{
    padding:28px 20px 14px;
    position:relative;
  }
  .topbar .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin:0 0 4px;
  }
  .topbar h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:26px;
    margin:0;
    letter-spacing:-0.01em;
  }
  .ledger-rule{
    height:1px;
    background:var(--line);
    margin:0 20px;
    position:relative;
  }
  .ledger-rule::after{
    content:'';
    position:absolute;
    left:0;right:0;top:3px;
    height:1px;
    background:var(--line);
  }

  /* ---- Balance hero ---- */
  .balance-card{
    margin:16px 20px 8px;
    padding:22px 20px 20px;
    background:var(--paper-card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    border:1px solid var(--line);
    position:relative;
    overflow:hidden;
  }
  .balance-card::before{
    content:'';
    position:absolute;
    left:0; top:0; bottom:0;
    width:4px;
    background:repeating-linear-gradient(180deg, var(--gold) 0 8px, transparent 8px 14px);
  }
  .balance-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--ink-soft);
    margin:0 0 6px;
  }
  .balance-amount{
    font-family:'Fraunces',serif;
    font-size:40px;
    font-weight:600;
    letter-spacing:-0.01em;
    line-height:1;
    margin:0 0 4px;
  }
  .balance-amount .cents{ font-size:22px; color:var(--ink-soft); }
  .balance-total-rule{
    height:2px;
    margin-top:10px;
    background:
      linear-gradient(var(--ink) 0 100%);
    background-size:100% 1px;
    background-repeat:repeat-y;
    position:relative;
  }
  .balance-total-rule{
    border-top:1.5px solid var(--ink);
    border-bottom:1.5px solid var(--ink);
    height:3px;
    margin-top:12px;
  }
  .balance-sub{
    display:flex;
    gap:18px;
    margin-top:14px;
  }
  .balance-sub div{ flex:1; }
  .balance-sub .k{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-faint);
    margin-bottom:3px;
  }
  .balance-sub .v{
    font-family:'IBM Plex Mono',monospace;
    font-size:15px;
    font-weight:600;
  }
  .v.income{ color:var(--income); }
  .v.expense{ color:var(--expense); }

  /* ---- Section titles ---- */
  .section{ padding:18px 20px 4px; }
  .section-title{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:12px;
  }
  .section-title h2{
    font-family:'Fraunces',serif;
    font-size:17px;
    font-weight:600;
    margin:0;
  }
  .section-title .see-all{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--gold);
    cursor:pointer;
    background:none;border:none;
    text-transform:uppercase;
    letter-spacing:0.06em;
  }

  /* ---- Cards / lists ---- */
  .card{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .chart-card{ padding:16px 14px 8px; margin-bottom:14px; }
  .chart-card .empty{
    text-align:center;
    padding:30px 10px 20px;
    color:var(--ink-faint);
    font-size:13px;
  }

  .tx-list{ display:flex; flex-direction:column; }
  .tx-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 14px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .tx-row:last-child{ border-bottom:none; }
  .tx-icon{
    width:36px;height:36px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif; font-weight:600; font-size:15px;
    flex-shrink:0;
  }
  .tx-icon.income{ background:var(--income-bg); color:var(--income); }
  .tx-icon.expense{ background:var(--expense-bg); color:var(--expense); }
  .tx-mid{ flex:1; min-width:0; }
  .tx-cat{ font-size:14px; font-weight:600; color:var(--ink); }
  .tx-meta{ font-size:12px; color:var(--ink-faint); margin-top:2px; }
  .tx-amount{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:14.5px;
    white-space:nowrap;
  }

  .empty-block{
    text-align:center;
    padding:34px 20px;
    color:var(--ink-faint);
  }
  .empty-block .big{ font-family:'Fraunces',serif; font-size:15px; color:var(--ink-soft); margin-bottom:4px;}
  .empty-block .small{ font-size:12.5px; }

  /* ---- Goal / debt bars ---- */
  .prog-card{ padding:14px; margin-bottom:12px; }
  .prog-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
  .prog-name{ font-weight:600; font-size:14.5px; }
  .prog-nums{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft);}
  .prog-track{ height:8px; background:var(--paper-card-2); border-radius:5px; overflow:hidden; border:1px solid var(--line);}
  .prog-fill{ height:100%; background:var(--gold); border-radius:5px; transition:width .4s ease;}
  .prog-fill.debt{ background:var(--expense); }
  .prog-bottom{ display:flex; justify-content:space-between; margin-top:6px;}
  .prog-pct{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-faint);}
  .prog-actions{ display:flex; gap:10px; }
  .prog-actions button{
    background:none;border:none;font-family:'IBM Plex Mono',monospace;
    font-size:11px; color:var(--gold); cursor:pointer; padding:0;
    text-transform:uppercase; letter-spacing:0.04em;
  }

  /* ---- Buttons ---- */
  .btn-primary{
    background:var(--ink);
    color:var(--paper-card);
    border:none;
    border-radius:10px;
    padding:13px 18px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14.5px;
    cursor:pointer;
    width:100%;
  }
  .btn-secondary{
    background:transparent;
    color:var(--ink);
    border:1.5px solid var(--line-strong);
    border-radius:10px;
    padding:11px 16px;
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
  }
  .btn-ghost-danger{
    background:none;border:none;color:var(--expense);
    font-size:12.5px; font-family:'IBM Plex Mono',monospace;
    cursor:pointer; text-transform:uppercase; letter-spacing:0.04em;
  }

  .fab{
    position:fixed;
    left:50%;
    transform:translateX(-50%);
    bottom:84px;
    width:100%;
    max-width:480px;
    display:flex;
    justify-content:flex-end;
    padding:0 20px;
    pointer-events:none;
    z-index:40;
  }
  .fab button{
    pointer-events:auto;
    width:58px;height:58px;
    border-radius:50%;
    background:var(--ink);
    color:var(--paper-card);
    border:none;
    font-size:26px;
    box-shadow:0 6px 18px rgba(33,49,31,0.35);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }

  /* ---- Bottom nav ---- */
  .tabbar{
    position:fixed;
    left:50%; transform:translateX(-50%);
    bottom:0;
    width:100%; max-width:480px;
    background:var(--paper-card);
    border-top:1px solid var(--line);
    display:flex;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    z-index:30;
  }
  .tab-btn{
    flex:1;
    background:none;border:none;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:6px 2px;
    color:var(--ink-faint);
    font-family:'Inter',sans-serif;
    font-size:10.5px;
    font-weight:600;
    cursor:pointer;
    border-radius:8px;
  }
  .tab-btn.active{ color:var(--ink); background:var(--paper-card-2); }
  .tab-btn .icon{ font-size:18px; line-height:1; }

  /* ---- Modal / sheet ---- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(33,49,31,0.4);
    z-index:100;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .sheet{
    background:var(--paper);
    width:100%; max-width:480px;
    border-radius:20px 20px 0 0;
    max-height:88vh;
    overflow-y:auto;
    padding:18px 20px 28px;
    box-shadow:0 -8px 30px rgba(0,0,0,0.2);
  }
  .sheet-handle{
    width:80px;height:24px;
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 4px;
    cursor:grab;
    touch-action:none;
  }
  .sheet-handle::after{
    content:'';
    width:36px;height:4px;border-radius:3px;
    background:var(--line-strong);
  }
  .sheet h3{
    font-family:'Fraunces',serif;
    font-size:19px; font-weight:600;
    margin:0 0 16px;
  }
  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.07em;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .field input, .field select, .field textarea{
    width:100%;
    padding:11px 12px;
    border-radius:9px;
    border:1.5px solid var(--line-strong);
    background:var(--paper-card);
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:2px solid var(--gold-soft);
    outline-offset:1px;
  }
  .toggle-row{ display:flex; gap:8px; margin-bottom:16px; }
  .toggle-row button{
    flex:1;
    padding:11px;
    border-radius:9px;
    border:1.5px solid var(--line-strong);
    background:var(--paper-card);
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .toggle-row button.on.income{ background:var(--income-bg); border-color:var(--income); color:var(--income); }
  .toggle-row button.on.expense{ background:var(--expense-bg); border-color:var(--expense); color:var(--expense); }
  .toggle-row button.on.transfer{ background:var(--paper-card-2); border-color:var(--gold); color:var(--gold); }
  .inline-add{
    display:flex; gap:8px; margin-top:8px;
  }
  .inline-add input{ flex:1; }
  .inline-add button{
    background:var(--paper-card-2);
    border:1.5px solid var(--line-strong);
    border-radius:8px;
    padding:0 14px;
    font-weight:700;
    cursor:pointer;
    color:var(--ink);
  }
  .sheet-actions{ display:flex; gap:10px; margin-top:6px; }
  .sheet-actions .btn-primary{ flex:1; }

  /* ---- Settings list management ---- */
  .manage-block{ margin-bottom:22px; }
  .manage-block h4{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; text-transform:uppercase; letter-spacing:0.08em;
    color:var(--ink-soft); margin:0 0 10px;
  }
  .chip-list{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    background:var(--paper-card);
    border:1px solid var(--line-strong);
    border-radius:20px;
    padding:7px 10px 7px 13px;
    font-size:12.5px;
    display:flex; align-items:center; gap:8px;
  }
  .chip button{
    background:none;border:none;color:var(--expense);
    font-size:13px; cursor:pointer; padding:0;
    line-height:1;
  }

  .toast{
    position:fixed;
    bottom:100px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper-card);
    padding:10px 18px; border-radius:9px;
    font-size:13px; font-weight:600;
    z-index:200;
    box-shadow:0 6px 16px rgba(0,0,0,0.25);
    opacity:0; pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }

  ::-webkit-scrollbar{ width:0; height:0; }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <p class="eyebrow">Cuenta y Razón</p>
    <h1 id="header-title">Resumen</h1>
  </div>
  <div id="view-root"></div>
</div>

<div class="fab" id="fab-wrap">
  <button id="fab-btn" aria-label="Añadir movimiento">+</button>
</div>

<div class="tabbar" id="tabbar"></div>
<div id="modal-root"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   ESTADO Y PERSISTENCIA
   ========================================================= */
const DEFAULT_STATE = {
  accounts: ['Efectivo'],
  incomeTypes: ['Nómina/salario','Renta','Dividendos','Intereses','Ventas/reembolsos','Otros'],
  categories: ['Vivienda','Suministros','Comida/Supermercado','Restaurantes/Bares','Transporte','Salud','Ocio/Entretenimiento','Ropa','Suscripciones','Educación/Formación','Seguros','Mascotas','Regalos/Donaciones','Deudas/Préstamos','Otros'],
  categoryTypes: {
    'Vivienda':'necesidad', 'Suministros':'necesidad', 'Comida/Supermercado':'necesidad',
    'Transporte':'necesidad', 'Salud':'necesidad', 'Seguros':'necesidad', 'Deudas/Préstamos':'necesidad',
    'Restaurantes/Bares':'deseo', 'Ocio/Entretenimiento':'deseo', 'Ropa':'deseo', 'Suscripciones':'deseo',
    'Mascotas':'deseo', 'Regalos/Donaciones':'deseo', 'Educación/Formación':'deseo', 'Otros':'deseo'
  },
  transactions: [],
  goals: [],
  debts: [],
  fixedExpenses: [],
  fixedIncomes: [],
  categoryBudgets: {},
  budgetRule: { necesidad: 50, deseo: 30, ahorro: 20 },
  theme: 'clasico',
  netWorthHistory: [],
  assets: [],
  showEmergencyInBalance: false,
  accountRates: {},
  lastAccount: null,
  lastCategory: null,
  lastIncomeType: null,
  resumenSections: { netWorth:true, upcomingPayments:true, fixedExpenses:true, budgetRule:true, categoryChart:true, categoryBudgets:true, trend:true, emergencyFund:true, remuneratedAccounts:true, recentTx:true }
};

function getResumenSections(){
  const defaults = { netWorth:true, upcomingPayments:true, fixedExpenses:true, budgetRule:true, categoryChart:true, categoryBudgets:true, trend:true, emergencyFund:true, remuneratedAccounts:true, recentTx:true };
  return Object.assign({}, defaults, state.resumenSections||{});
}

function getDebtLinkedGoalIds(){
  return new Set(state.fixedExpenses.filter(fe=>fe.debtId && fe.goalId).map(fe=>fe.goalId));
}

function getNetWorthEligibleSavings(){
  const excluded = getDebtLinkedGoalIds();
  let total = state.goals.filter(g=>!excluded.has(g.id)).reduce((s,g)=>s+Number(g.current||0),0);
  const countedAccounts = new Set();
  state.goals.forEach(g=>{
    if(!excluded.has(g.id) && g.linkedAccount && g.excludeFromBalance && !countedAccounts.has(g.linkedAccount)){
      countedAccounts.add(g.linkedAccount);
      total += getAccountBalance(g.linkedAccount);
    }
  });
  return total;
}

function getEmergencyFundSavedTotal(){
  const excluded = getDebtLinkedGoalIds();
  const emergencyGoal = state.goals.find(g=>g.isEmergencyFund);
  if(emergencyGoal){
    if(excluded.has(emergencyGoal.id)) return 0;
    let total = Number(emergencyGoal.current||0);
    if(emergencyGoal.linkedAccount){
      total += getAccountBalance(emergencyGoal.linkedAccount);
    }
    return total;
  }
  return state.goals.filter(g=>!excluded.has(g.id)).reduce((s,g)=>s+Number(g.current||0),0);
}

function computeNetWorth(){
  const t = totals();
  const savings = getNetWorthEligibleSavings();
  const otherAssets = (state.assets||[]).reduce((s,a)=>s+Number(a.value||0),0);
  const debt = state.debts.reduce((s,d)=>s+Number(d.remaining||0),0);
  const assets = t.balance + savings + otherAssets;
  return { assets, savings, balance: t.balance, otherAssets, debt, net: assets - debt };
}

function recordNetWorthSnapshot(){
  const today = todayISO();
  state.netWorthHistory = state.netWorthHistory || [];
  const nw = computeNetWorth();
  const last = state.netWorthHistory[state.netWorthHistory.length-1];
  let changed = false;
  if(last && last.date===today){
    if(last.value!==nw.net){ last.value = nw.net; changed = true; }
  } else {
    state.netWorthHistory.push({date: today, value: nw.net});
    changed = true;
    if(state.netWorthHistory.length>400) state.netWorthHistory = state.netWorthHistory.slice(-400);
  }
  return changed;
}

function getBudgetRule(){
  return (state.budgetRule && state.budgetRule.necesidad!=null) ? state.budgetRule : { necesidad:50, deseo:30, ahorro:20 };
}

function getCategoryType(cat){
  if(state.categoryTypes && state.categoryTypes[cat]) return state.categoryTypes[cat];
  return 'deseo';
}

let state = null;
let currentTab = 'resumen';
const STORAGE_KEY = 'finapp-state-v1';

const hasClaudeStorage = typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function';

async function storageGet(key){
  if(hasClaudeStorage){
    return await window.storage.get(key, false);
  }
  try{
    const raw = localStorage.getItem(key);
    return raw!=null ? { key, value: raw, shared:false } : null;
  }catch(e){
    return null;
  }
}

async function storageSet(key, value){
  if(hasClaudeStorage){
    return await window.storage.set(key, value, false);
  }
  try{
    localStorage.setItem(key, value);
    return { key, value, shared:false };
  }catch(e){
    return null;
  }
}

async function loadState(){
  try{
    const res = await storageGet(STORAGE_KEY);
    if(res && res.value){
      state = JSON.parse(res.value);
      // asegurar que existan todas las claves si el modelo cambia en el futuro
      state = Object.assign({}, DEFAULT_STATE, state);
    } else {
      state = JSON.parse(JSON.stringify(DEFAULT_STATE));
    }
  }catch(e){
    state = JSON.parse(JSON.stringify(DEFAULT_STATE));
  }
}

async function saveState(){
  try{
    const result = await storageSet(STORAGE_KEY, JSON.stringify(state));
    if(!result){ showToast('No se pudo guardar. Inténtalo de nuevo.'); }
  }catch(e){
    showToast('Error al guardar los datos.');
  }
}

/* =========================================================
   UTILIDADES
   ========================================================= */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmt(n){
  const num = Number(n)||0;
  return num.toLocaleString('es-ES',{minimumFractionDigits:2, maximumFractionDigits:2});
}
function formatAmountLive(raw){
  let s = String(raw).replace(/[^\d,]/g, '');
  const firstComma = s.indexOf(',');
  if(firstComma!==-1){
    s = s.slice(0,firstComma+1) + s.slice(firstComma+1).replace(/,/g,'');
  }
  let [intPart, decPart] = s.split(',');
  intPart = (intPart||'').replace(/^0+(?=\d)/,'');
  intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  let result = intPart;
  if(decPart!==undefined){
    result += ',' + decPart.slice(0,2);
  } else if(s.endsWith(',')){
    result += ',';
  }
  return result;
}
function parseAmount(str){
  if(str===undefined || str===null || str==='') return NaN;
  const cleaned = String(str).trim().replace(/\./g,'').replace(',', '.');
  if(cleaned==='') return NaN;
  return parseFloat(cleaned);
}
function attachAmountFormatting(input){
  if(!input) return;
  if(input.value){ input.value = formatAmountLive(input.value); }
  input.addEventListener('input', ()=>{
    const cursorFromEnd = input.value.length - (input.selectionStart ?? input.value.length);
    const formatted = formatAmountLive(input.value);
    input.value = formatted;
    const pos = Math.max(0, formatted.length - cursorFromEnd);
    try{ input.setSelectionRange(pos,pos); }catch(_){}
  });
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function monthKey(d){ return d.slice(0,7); }
function niceDate(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('es-ES',{day:'2-digit', month:'short'});
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove('show'), 2200);
}
function initials(str){
  return (str||'?').trim().slice(0,2).toUpperCase();
}

function openConfirmSheet(message, onConfirm, opts){
  opts = opts || {};
  const overlay = document.createElement('div');
  overlay.className='overlay';
  overlay.innerHTML = `
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h3 style="${opts.danger? 'color:var(--expense);':''}">${opts.title || 'Confirmar'}</h3>
      <p style="font-size:13px;color:var(--ink-soft);margin:0 0 18px;">${message}</p>
      <div class="sheet-actions">
        <button class="btn-secondary" id="cf-cancel" style="flex:1;">Cancelar</button>
        <button class="btn-primary" id="cf-ok" style="flex:1;${opts.danger? 'background:var(--expense);':''}">${opts.confirmLabel || 'Confirmar'}</button>
      </div>
    </div>
  `;
  document.getElementById('modal-root').appendChild(overlay);
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  overlay.querySelector('#cf-cancel').onclick = ()=> overlay.remove();
  overlay.querySelector('#cf-ok').onclick = async ()=>{
    overlay.remove();
    await onConfirm();
  };
}

function openAmountInputSheet(title, message, onSubmit){
  const overlay = document.createElement('div');
  overlay.className='overlay';
  overlay.innerHTML = `
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h3>${title}</h3>
      ${message? `<p style="font-size:13px;color:var(--ink-soft);margin:0 0 14px;">${message}</p>` : ''}
      <div class="field"><label>Importe (€)</label><input type="text" inputmode="decimal" id="ai-amount" placeholder="0,00"></div>
      <div class="sheet-actions"><button class="btn-primary" id="ai-save" style="flex:1;">Guardar</button></div>
    </div>
  `;
  document.getElementById('modal-root').appendChild(overlay);
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  attachAmountFormatting(overlay.querySelector('#ai-amount'));
  overlay.querySelector('#ai-save').onclick = async ()=>{
    const val = parseAmount(overlay.querySelector('#ai-amount').value);
    if(!val || val<=0){ showToast('Introduce un importe válido.'); return; }
    overlay.remove();
    await onSubmit(val);
  };
}

function getBalanceExcludedAccounts(){
  const excluded = new Set();
  state.goals.forEach(goal=>{
    if(goal.linkedAccount && goal.excludeFromBalance){
      excluded.add(goal.linkedAccount);
    }
  });
  return excluded;
}

function totals(){
  const now = todayISO().slice(0,7);
  const excludedAccounts = getBalanceExcludedAccounts();
  let balance = 0, monthIncome=0, monthExpense=0;
  state.transactions.forEach(tx=>{
    if(excludedAccounts.has(tx.account)) return;
    const amt = Number(tx.amount)||0;
    if(tx.type==='ingreso') balance += amt; else balance -= amt;
    if(monthKey(tx.date)===now && !tx.isTransfer && !tx.isAdjustment){
      if(tx.type==='ingreso') monthIncome += amt; else monthExpense += amt;
    }
  });
  return {balance, monthIncome, monthExpense};
}

function getAccountBalance(accountName){
  let bal = 0;
  state.transactions.forEach(tx=>{
    if(tx.account!==accountName) return;
    const amt = Number(tx.amount)||0;
    if(tx.type==='ingreso') bal += amt; else bal -= amt;
  });
  return bal;
}

function getExplicitAhorroThisMonth(){
  const now = todayISO().slice(0,7);
  const excludedAccounts = getBalanceExcludedAccounts();
  let total = 0;
  state.transactions.filter(t=>t.type==='gasto' && monthKey(t.date)===now && !excludedAccounts.has(t.account) && getCategoryType(t.category)==='ahorro').forEach(t=>{
    total += Number(t.amount||0);
  });
  const countedAccounts = new Set();
  state.goals.forEach(g=>{
    if(g.contributionHistory){
      g.contributionHistory.filter(c=>monthKey(c.date)===now).forEach(c=>{
        total += Number(c.amount||0);
      });
    }
    if(g.linkedAccount && !countedAccounts.has(g.linkedAccount)){
      countedAccounts.add(g.linkedAccount);
      state.transactions.filter(t=>t.type==='ingreso' && t.account===g.linkedAccount && monthKey(t.date)===now).forEach(t=>{
        total += Number(t.amount||0);
      });
    }
  });
  return total;
}

function budget503020(){
  const now = todayISO().slice(0,7);
  const excludedAccounts = getBalanceExcludedAccounts();
  let income=0, necesidad=0, deseo=0;
  state.transactions.filter(t=>monthKey(t.date)===now && !excludedAccounts.has(t.account) && !t.isTransfer && !t.isAdjustment).forEach(t=>{
    if(t.type==='ingreso'){ income += Number(t.amount||0); return; }
    const amt = Number(t.amount||0);
    const catType = getCategoryType(t.category);
    if(catType==='necesidad') necesidad += amt;
    else if(catType==='deseo') deseo += amt;
    // catType==='ahorro' (ej. amortizaciones de deuda) no cuenta como necesidad ni deseo.
  });
  const ahorro = getExplicitAhorroThisMonth();
  function pct(v){ return income>0 ? Math.round((v/income)*100) : 0; }
  return {
    income, necesidad, deseo, ahorro,
    pctNecesidad: pct(necesidad), pctDeseo: pct(deseo), pctAhorro: pct(ahorro)
  };
}

function categoryBreakdown(){
  const now = todayISO().slice(0,7);
  const excludedAccounts = getBalanceExcludedAccounts();
  const map = {};
  state.transactions.filter(t=>t.type==='gasto' && monthKey(t.date)===now && !excludedAccounts.has(t.account) && !t.isTransfer && !t.isAdjustment).forEach(t=>{
    map[t.category] = (map[t.category]||0) + Number(t.amount||0);
  });
  return map;
}

];
function renderTabbar(){
  const bar = document.getElementById('tabbar');
  bar.innerHTML = '';
  TABS.forEach(t=>{
    const b = document.createElement('button');
    b.className = 'tab-btn' + (currentTab===t.id?' active':'');
    b.innerHTML = `<span class="icon">${t.icon}</span><span>${t.label}</span>`;
    b.onclick = ()=>{
      if(t.id==='desglose' && currentTab!=='desglose') desgloseVisibleMonths = 36;
      currentTab=t.id; render();
    };
    bar.appendChild(b);
  });
}

            <span style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:${r.breach?'var(--expense)':'var(--ink-soft)'};font-weight:${r.breach?'700':'400'};">${r.real}% · ${fmt(r.amount)} € <span style="color:var(--ink-faint);font-weight:400;">(objetivo ${r.objetivo}% · ${fmt(r.targetAmount)} €)</span></span>
          </div>
          <div style="position:relative;height:9px;background:var(--paper-card-2);border-radius:5px;border:1px solid ${r.breach?'var(--expense)':'var(--line)'};overflow:visible;">
            <div style="position:absolute;left:0;top:0;bottom:0;width:${Math.min(100,Math.max(0,r.real))}%;background:${r.color};border-radius:5px;"></div>
            <div style="position:absolute;left:${r.objetivo}%;top:-2px;bottom:-2px;width:2px;background:var(--ink);"></div>
          </div>
        </div>
      `).join('') + `<div style="font-size:11px;color:var(--ink-faint);margin-top:2px;">La línea marca el objetivo de la regla; la barra de color muestra tu reparto real este mes.</div>`;
    }
  }

  if(sections.recentTx){
    // recent tx list
    const recentCard = root.querySelector('#recent-tx-card');
    const recent = dedupeTransfersForDisplay([...state.transactions]).sort((a,b)=> b.date.localeCompare(a.date) || b.id.localeCompare(a.id)).slice(0,5);
    if(recent.length===0){
      recentCard.innerHTML = `<div class="empty-block"><div class="big">Sin movimientos todavía</div><div class="small">Pulsa el botón + para añadir el primero.</div></div>`;
    } else {
      const list = document.createElement('div');
      list.className='tx-list';
      recent.forEach(tx=> list.appendChild(txRow(tx)));
      recentCard.appendChild(list);
    }
  }

  // map de categorías: lo necesitan tanto el gráfico como los presupuestos por categoría
  const map = (sections.categoryChart || sections.categoryBudgets) ? categoryBreakdown() : {};

  if(sections.categoryChart){
    // chart
    const labels = Object.keys(map);
    const data = Object.values(map);
    const canvas = root.querySelector('#cat-chart');
    if(labels.length===0){
      canvas.style.display='none';
      root.querySelector('#cat-empty').style.display='block';
    } else {
      const palette = ['#A67C27','#92453A','#5C6F8A','#8A6A9E','#B08968','#6B8F71','#9C6B4F','#7A6A8A','#4F7942','#B5502C','#3D5A5A','#8A7A4F','#6A5A7A','#A68A5B'];
      let paletteIdx = 0;
      const colors = labels.map(l=> getCategoryType(l)==='ahorro' ? '#55744B' : palette[(paletteIdx++)%palette.length]);
      if(chartCat) chartCat.destroy();
      chartCat = new Chart(canvas, {
        type:'doughnut',
        data:{ labels, datasets:[{ data, backgroundColor: colors, borderColor:'#F6F1E4', borderWidth:2 }]},
        options:{
          cutout:'62%',
          plugins:{
            legend:{ position:'bottom', labels:{ boxWidth:10, font:{family:'Inter', size:11}, color:'#55645A', padding:12 } }
          }
        }
      });
    }
  }

  if(sections.categoryBudgets){
    // presupuestos por categoría
    const budgetsCard = root.querySelector('#cat-budgets-card');
    const budgetsSection = root.querySelector('#cat-budgets-section');
    const budgetEntries = Object.entries(state.categoryBudgets||{});
    if(budgetEntries.length===0){
      budgetsSection.style.display='none';
    } else {
      budgetsSection.style.display='block';
      budgetsCard.innerHTML = budgetEntries.map(([cat, limit])=>{
        const spent = map[cat] || 0;
        const pct = limit>0 ? Math.round((spent/limit)*100) : 0;
        const over = spent>limit;
        return `
          <div style="margin-bottom:14px;">
            <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;">
              <span style="font-weight:600;font-size:13.5px;">${over?'⚠ ':''}${cat}</span>
              <span style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:${over?'var(--expense)':'var(--ink-soft)'};">${fmt(spent)} € / ${fmt(limit)} €</span>
            </div>
            <div style="height:8px;background:var(--paper-card-2);border-radius:5px;border:1px solid ${over?'var(--expense)':'var(--line)'};overflow:hidden;">
              <div style="height:100%;width:${Math.min(100,pct)}%;background:${over?'var(--expense)':'var(--gold)'};border-radius:5px;"></div>
            </div>
          </div>
        `;
      }).join('');
    }
  }

  if(sections.trend){
    // tendencia últimos meses
    const trendCanvas = root.querySelector('#trend-chart');
    const trendExcludedAccounts = getBalanceExcludedAccounts();
    const trendMonths = [];
    const now2 = new Date();
    for(let i=5;i>=0;i--){
      const d = new Date(now2.getFullYear(), now2.getMonth()-i, 1);
      trendMonths.push(d);
    }
    const trendLabels = trendMonths.map(d=>d.toLocaleDateString('es-ES',{month:'short'}));
    const trendIncome = trendMonths.map(d=>{
      const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      return state.transactions.filter(t=>t.type==='ingreso' && !trendExcludedAccounts.has(t.account) && !t.isTransfer && !t.isAdjustment && monthKey(t.date)===key).reduce((s,t)=>s+Number(t.amount||0),0);
    });
    const trendExpense = trendMonths.map(d=>{
      const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      return state.transactions.filter(t=>t.type==='gasto' && !trendExcludedAccounts.has(t.account) && !t.isTransfer && !t.isAdjustment && monthKey(t.date)===key).reduce((s,t)=>s+Number(t.amount||0),0);
    });
    if(chartTrend) chartTrend.destroy();
    chartTrend = new Chart(trendCanvas, {
      type:'bar',
      data:{
        labels: trendLabels,
        datasets:[
          { label:'Ingresos', data: trendIncome, backgroundColor:'#55744B', borderRadius:4 },
          { label:'Gastos', data: trendExpense, backgroundColor:'#92453A', borderRadius:4 }
        ]
      },
      options:{
        plugins:{ legend:{ position:'bottom', labels:{ boxWidth:10, font:{family:'Inter', size:11}, color:'#55645A', padding:12 } } },
        scales:{
          y:{ beginAtZero:true, ticks:{ color:'#55645A', font:{family:'Inter', size:11} }, grid:{ color:'rgba(33,49,31,0.08)' } },
          x:{ ticks:{ color:'#55645A', font:{family:'Inter', size:11} }, grid:{ display:false } }
        }
      }
    });
  }

  if(sections.emergencyFund){
    const emCard = root.querySelector('#emergency-card');
    const avgExpense = getAverageMonthlyExpense();
    const savedTotal = getEmergencyFundSavedTotal();
    if(avgExpense<=0){
      emCard.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">
          <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);">Ahorro en metas</span>
        </div>
        <div style="font-family:'Fraunces',serif;font-size:24px;font-weight:600;margin-bottom:6px;">${fmt(savedTotal)} €</div>
        <div style="font-size:12px;color:var(--ink-faint);">Registra algún gasto en los últimos meses para calcular tu fondo de emergencia recomendado y ver tu progreso sobre él.</div>
      `;
    } else {
      const min3 = avgExpense*3, max6 = avgExpense*6;
      const pct = Math.min(100, Math.round((savedTotal/max6)*100));
      const status = savedTotal>=max6 ? {label:'Fondo completo', color:'var(--income)'} : savedTotal>=min3 ? {label:'Cobertura mínima alcanzada', color:'var(--gold)'} : {label:'Por debajo del mínimo', color:'var(--expense)'};
      emCard.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">
          <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);">Ahorro en metas vs. fondo recomendado</span>
          <span style="font-size:11px;font-weight:700;color:${status.color};">${status.label}</span>
        </div>
        <div style="font-family:'Fraunces',serif;font-size:24px;font-weight:600;margin-bottom:6px;">${fmt(savedTotal)} €</div>
        <div style="height:8px;background:var(--paper-card-2);border-radius:5px;border:1px solid var(--line);overflow:hidden;margin-bottom:6px;">
          <div style="height:100%;width:${pct}%;background:${status.color};border-radius:5px;"></div>
        </div>
        <div style="font-size:12px;color:var(--ink-soft);">Recomendado: entre ${fmt(min3)} € (3 meses) y ${fmt(max6)} € (6 meses) de gastos, según tu media de los últimos meses (${fmt(avgExpense)} €/mes).</div>
      `;
    }
  }

  if(sections.remuneratedAccounts && Object.keys(state.accountRates||{}).length>0){
    const remCard = root.querySelector('#remunerated-card');
    if(remCard){
      const rows = Object.entries(state.accountRates).map(([acc, rate])=>{
        const bal = getAccountBalance(acc);
        const annualInterest = bal>0 ? bal * (rate/100) : 0;
        const monthlyInterest = annualInterest/12;
        return `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line);">
            <div>
              <div style="font-size:13.5px;font-weight:600;">${acc}</div>
              <div style="font-size:11.5px;color:var(--ink-faint);margin-top:2px;">TAE ${rate}% · saldo ${fmt(bal)} €</div>
            </div>
            <div style="text-align:right;">
              <div style="font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--income);">+${fmt(annualInterest)} €/año</div>
              <div style="font-size:11px;color:var(--ink-faint);">≈ ${fmt(monthlyInterest)} €/mes</div>
            </div>
          </div>
        `;
      }).join('');
      remCard.innerHTML = rows + `<div style="font-size:11px;color:var(--ink-faint);margin-top:8px;">Estimación simple sobre el saldo actual, sin capitalización compuesta ni retenciones fiscales.</div>`;
    }
  }
}

function formatPeriodicityInfo(item){
  const freq = item.frequency || 'mensual';
  const label = FREQ_LABELS[freq] || 'Mensual';
  if(freq==='mensual'){
    return `${label} · día ${item.day||1}`;
  }
  if(item.referenceDate){
    return `${label} · ${niceDate(item.referenceDate)}`;
  }
  return `${label} · día ${item.day||1}`;
}

function openDebtHistorySheet(){
  const overlay = document.createElement('div');
  overlay.className='overlay';
  const deudasPagadas = state.debts.filter(d=>Number(d.remaining||0)<=0);

  const rows = deudasPagadas.length===0
    ? `<div class="empty-block" style="padding:20px;"><div class="big">Aún no tienes ninguna deuda saldada</div><div class="small">Cuando termines de pagar una deuda por completo, aparecerá aquí.</div></div>`
    : deudasPagadas.map(d=>{
        const lastDate = d.history && d.history.length ? [...d.history].sort((a,b)=>a.date.localeCompare(b.date)).slice(-1)[0].date : null;
        return `
        <div data-debt-id="${d.id}" style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);cursor:pointer;">
          <div>
            <div style="font-size:13.5px;font-weight:600;">${d.name} <span style="color:var(--income);font-size:10.5px;font-weight:700;">· saldada</span></div>
            <div style="font-size:11.5px;color:var(--ink-faint);margin-top:2px;">Total pagado ${fmt(d.totalPaidAccum||0)} € · intereses ${fmt(d.interestPaid||0)} €${lastDate? ` · ${niceDate(lastDate)}` : ''}</div>
          </div>
          <span style="color:var(--ink-faint);font-size:13px;">›</span>
        </div>
      `;}).join('');

  overlay.innerHTML = `
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h3>Historial de deuda</h3>
      <p style="font-size:12px;color:var(--ink-faint);margin:0 0 8px;">Deudas y préstamos que ya has terminado de pagar por completo.</p>
      <div class="card" style="padding:14px;">${rows}</div>
      <div class="sheet-actions" style="margin-top:16px;"><button class="btn-primary" id="debt-history-close" style="flex:1;">Cerrar</button></div>
    </div>
  `;
  document.getElementById('modal-root').appendChild(overlay);
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  overlay.querySelector('#debt-history-close').onclick = ()=> overlay.remove();
  overlay.querySelectorAll('[data-debt-id]').forEach(row=>{
    row.onclick = ()=>{
      const id = row.dataset.debtId;
      overlay.remove();
      openDebtChartSheet(id);
    };
  });
}

function openAllRegisteredSheet(){
  const overlay = document.createElement('div');
  overlay.className='overlay';

  function groupHTML(title, items, colorVar, kind){
    if(items.length===0){
      return `<h4 style="font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);margin:18px 0 8px;">${title}</h4><div style="font-size:12px;color:var(--ink-faint);">Nada registrado.</div>`;
    }
    const rows = items.map(it=>`
      <div data-kind="${kind}" data-id="${it.id}" style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);cursor:pointer;">
        <div>
          <div style="font-size:13.5px;font-weight:600;">${it.name}${it.debtId?' <span style="color:var(--gold);font-size:10.5px;font-weight:700;">· deuda</span>':''}${it.goalId?' <span style="color:var(--income);font-size:10.5px;font-weight:700;">· meta</span>':''}${it.endDate?` <span style="color:var(--ink-faint);font-size:10.5px;">· hasta ${niceDate(it.endDate)}</span>`:''}</div>
          <div style="font-size:11.5px;color:var(--ink-faint);margin-top:2px;">${formatPeriodicityInfo(it)}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <div style="font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:${colorVar};white-space:nowrap;">${fmt(it.amount)} €</div>
          <span style="color:var(--ink-faint);font-size:13px;">›</span>
        </div>
      </div>
    `).join('');
    return `<h4 style="font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);margin:18px 0 4px;">${title} <span style="color:var(--ink-faint);font-weight:400;text-transform:none;">(${items.length})</span></h4>${rows}`;
  }

  const personales = state.fixedExpenses.filter(fe=>!fe.isPublic);
  const publicos = state.fixedExpenses.filter(fe=>!!fe.isPublic);
  const ingresos = state.fixedIncomes || [];

  overlay.innerHTML = `
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h3>Ver todo lo registrado</h3>
      <p style="font-size:12px;color:var(--ink-faint);margin:0 0 4px;">Todos tus gastos e ingresos fijos, con su periodicidad y el día (o fecha) en que se cobran.</p>
      <div class="card" style="padding:14px;margin-top:8px;">
        ${groupHTML('Gastos fijos', personales, 'var(--expense)', 'expense')}
        ${groupHTML('Impuestos y tasas públicas', publicos, 'var(--expense)', 'expense')}
        ${groupHTML('Ingresos fijos', ingresos, 'var(--income)', 'income')}
      </div>
      <div class="sheet-actions" style="margin-top:16px;"><button class="btn-primary" id="registered-close" style="flex:1;">Cerrar</button></div>
    </div>
  `;
  document.getElementById('modal-root').appendChild(overlay);
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  overlay.querySelector('#registered-close').onclick = ()=> overlay.remove();
  overlay.querySelectorAll('[data-kind]').forEach(row=>{
    row.onclick = ()=>{
      const kind = row.dataset.kind;
      const id = row.dataset.id;
      overlay.remove();
      if(kind==='expense'){
        const fe = state.fixedExpenses.find(x=>x.id===id);
        if(fe) openFixedSheet(fe);
      } else if(kind==='income'){
        const fi = (state.fixedIncomes||[]).find(x=>x.id===id);
        if(fi) openFixedIncomeSheet(fi);
      } else if(kind==='debt'){
        openDebtChartSheet(id);
      }
    };
  });
}

function openAssetsSheet(){
  const overlay = document.createElement('div');
  overlay.className='overlay';
  overlay.innerHTML = `
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h3>Mis bienes</h3>
      <p style="font-size:12px;color:var(--ink-faint);margin:0 0 16px;">Vivienda, coche u otros bienes de valor que quieras sumar a tu patrimonio neto. Indica su valor estimado actual.</p>
      <div id="assets-list" style="margin-bottom:16px;"></div>
      <div class="sheet-actions">
        <button class="btn-secondary" id="assets-close" style="flex:1;">Cerrar</button>
        <button class="btn-primary" id="assets-add" style="flex:1;">+ Añadir bien</button>
      </div>
    </div>
  `;
  document.getElementById('modal-root').appendChild(overlay);
  overlay.onclick = (e)=>{ if(e.target===overlay){ overlay.remove(); render(); } };
  overlay.querySelector('#assets-close').onclick = ()=>{ overlay.remove(); render(); };
  const listWrap = overlay.querySelector('#assets-list');

  function renderAssetsList(){
    state.assets = state.assets || [];
    if(state.assets.length===0){
      listWrap.innerHTML = `<div class="empty-block" style="padding:16px;"><div class="big">Aún no has añadido ningún bien</div><div class="small">Añade tu vivienda, coche u otro bien de valor.</div></div>`;
      return;
    }
    listWrap.innerHTML='';
    state.assets.forEach(a=>{
      const row = document.createElement('div');
      row.className='card prog-card';
      row.style.marginBottom='10px';
      row.innerHTML = `
        <div class="prog-top">
          <div class="prog-name">${a.name}</div>
          <div class="prog-nums">${fmt(a.value)} €</div>
        </div>
        <div class="prog-actions" style="margin-top:8px;">
          <button data-act="edit">Editar</button>
          <button data-act="del">Eliminar</button>
        </div>
      `;
      row.querySelector('[data-act="edit"]').onclick = ()=> openAssetEditSheet(a, renderAssetsList);
      row.querySelector('[data-act="del"]').onclick = ()=>{
        openConfirmSheet(`¿Eliminar "${a.name}" de tus bienes?`, async ()=>{
          state.assets = state.assets.filter(x=>x.id!==a.id);
          await saveState();
          renderAssetsList();
        }, {title:'Eliminar bien', confirmLabel:'Eliminar', danger:true});
      };
      listWrap.appendChild(row);
    });
  }
  renderAssetsList();
  overlay.querySelector('#assets-add').onclick = ()=> openAssetEditSheet(null, renderAssetsList);
}

function openAssetEditSheet(asset, onSaved){
  const editing = !!asset;
  const overlay = document.createElement('div');
  overlay.className='overlay';
  overlay.innerHTML = `
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h3>${editing? 'Editar bien':'Nuevo bien'}</h3>
      <div class="field"><label>Nombre</label><input id="as-name" value="${asset?.name||''}" placeholder="Ej. Vivienda, Coche"></div>
      <div class="field"><label>Valor estimado actual (€)</label><input type="text" inputmode="decimal" id="as-value" value="${asset?.value!=null ? fmt(asset.value) : ''}" placeholder="0,00"></div>
      <div class="sheet-actions">${editing?'<button class="btn-secondary" id="as-delete">Eliminar</button>':''}<button class="btn-primary" id="as-save">${editing?'Guardar cambios':'Añadir'}</button></div>
    </div>
  `;
  document.getElementById('modal-root').appendChild(overlay);
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  attachAmountFormatting(overlay.querySelector('#as-value'));
  if(editing){
    overlay.querySelector('#as-delete').onclick = ()=>{
      openConfirmSheet(`¿Eliminar "${asset.name}" de tus bienes?`, async ()=>{
        state.assets = state.assets.filter(x=>x.id!==asset.id);
        await saveState();
        overlay.remove();
        if(onSaved) onSaved();
      }, {title:'Eliminar bien', confirmLabel:'Eliminar', danger:true});
    };
  }
  overlay.querySelector('#as-save').onclick = async ()=>{
    const name = overlay.querySelector('#as-name').value.trim();
    const value = parseAmount(overlay.querySelector('#as-value').value);
    if(!name){ showToast('Ponle un nombre al bien.'); return; }
    if(!value || value<=0){ showToast('Introduce un valor válido.'); return; }
    state.assets = state.assets || [];
    if(editing){ Object.assign(asset, {name, value}); }
    else { state.assets.push({id:uid(), name, value}); }
    await saveState();
    overlay.remove();
    if(onSaved) onSaved();
    showToast(editing?'Bien actualizado.':'Bien añadido.');
  };
}

function getAverageMonthlyExpense(){
  const now = new Date();
  const excludedAccounts = getBalanceExcludedAccounts();
  const monthsData = [];
  for(let i=0;i<3;i++){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const total = state.transactions.filter(t=>t.type==='gasto' && monthKey(t.date)===key && !excludedAccounts.has(t.account) && !t.isTransfer && !t.isAdjustment && getCategoryType(t.category)!=='ahorro').reduce((s,t)=>s+Number(t.amount||0),0);
    monthsData.push(total);
  }
  const nonZero = monthsData.filter(m=>m>0);
  if(nonZero.length===0) return 0;
  return nonZero.reduce((a,b)=>a+b,0)/nonZero.length;
}

function getEmergencyFundGoal(){
  const goal = state.goals.find(g=>g.isEmergencyFund);
  if(!goal) return null;
  const avgExpense = getAverageMonthlyExpense();
  if(avgExpense>0){
    const target = Math.round(avgExpense*6*100)/100;
    if(goal.target!==target){ goal.target = target; }
  }
  return goal;
}

function dedupeTransfersForDisplay(list){
  return list.filter(t=> !(t.isTransfer && t.type==='ingreso'));
}

function txRow(tx){
  const row = document.createElement('div');
  row.className='tx-row';
  if(tx.isTransfer){
    const pair = state.transactions.find(t=>t.id===tx.transferPairId);
    const isFrom = tx.type==='gasto';
    const otherAccount = pair ? pair.account : '';
    row.innerHTML = `
      <div class="tx-icon" style="background:var(--paper-card-2);color:var(--gold);">⇄</div>
      <div class="tx-mid">
        <div class="tx-cat">Transferencia</div>
        <div class="tx-meta">${niceDate(tx.date)} · ${isFrom? `${tx.account} → ${otherAccount}` : `${otherAccount} → ${tx.account}`}</div>
      </div>
      <div class="tx-amount" style="color:var(--gold);">${fmt(tx.amount)} €</div>
    `;
    row.onclick = ()=> openTxSheet(tx);
    return row;
  }
  const isIncome = tx.type==='ingreso';
  const label = isIncome ? tx.incomeType : tx.category;
  row.innerHTML = `

let desgloseVisibleMonths = 36;

function viewDesglose(){
  document.getElementById('header-title').textContent = 'Desglose de gastos';
  const root = document.createElement('div');

  const now = new Date();
  const startMonthIndex = now.getFullYear()*12 + now.getMonth();

  // último mes en que cada deuda con cuota vinculada seguirá pagando
  const debtLastMonthByFeId = {};
  state.fixedExpenses.filter(fe=>fe.debtId).forEach(fe=>{
    const debt = state.debts.find(d=>d.id===fe.debtId);
    if(debt){
      const monthsRemaining = estimateMonthsRemaining(debt);
      debtLastMonthByFeId[fe.id] = startMonthIndex + Math.max(0, monthsRemaining-1);
    }
  });

  // horizonte real: hasta que termine la última deuda, con tope de seguridad
  let maxDebtEnd = startMonthIndex - 1;
  Object.values(debtLastMonthByFeId).forEach(m=>{ if(m>maxDebtEnd) maxDebtEnd = m; });
  const hardCap = startMonthIndex + 239; // 20 años, tope de seguridad
  const neededMonths = Math.min(hardCap, Math.max(maxDebtEnd, startMonthIndex+11)) - startMonthIndex + 1;
  const visibleCount = Math.min(desgloseVisibleMonths, neededMonths);
  const hasMore = neededMonths > visibleCount;

  let monthsHTML = '';
  for(let i=0;i<visibleCount;i++){
    const monthIndex = startMonthIndex + i;
    const monthDate = new Date(Math.floor(monthIndex/12), monthIndex%12, 1);
    const label = monthDate.toLocaleDateString('es-ES', {month:'long', year:'numeric'});
    const isCurrentMonth = i===0;

    const items = state.fixedExpenses.filter(fe=>{
      if(!isDueInMonth(fe, monthDate)) return false;
      if(fe.debtId && debtLastMonthByFeId[fe.id]!==undefined && monthIndex>debtLastMonthByFeId[fe.id]) return false;
      return true;
    });
    const total = items.reduce((s,fe)=>s+Number(fe.amount||0),0);

    monthsHTML += `
      <div class="card" style="padding:14px;margin-bottom:12px;">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:${items.length?'10px':'0'};">
          <span style="font-family:'Fraunces',serif;font-weight:600;font-size:15px;text-transform:capitalize;">${label}</span>
          <span style="font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;color:var(--ink-soft);">${fmt(total)} €</span>
        </div>
        ${items.length===0 ? `<div style="font-size:12px;color:var(--ink-faint);">Sin gastos fijos este mes.</div>` : items.map(fe=>{
          const paid = isCurrentMonth && fixedPaidThisMonth(fe);
          return `
          <div ${isCurrentMonth?`data-desglose-fe="${fe.id}" style="cursor:pointer;"`:''} style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:13px;${isCurrentMonth?'cursor:pointer;':''}">
            <span style="${paid?'text-decoration:line-through;color:var(--ink-faint);':''}">${paid?'✓ ':''}${fe.name}${fe.debtId?' <span style="color:var(--gold);font-size:10.5px;">· cuota</span>':''}${fe.isPublic?' <span style="color:var(--ink-faint);font-size:10.5px;">· público</span>':''}</span>
            <span style="font-family:'IBM Plex Mono',monospace;color:${paid?'var(--income)':'var(--expense)'};">${fmt(fe.amount)} €</span>
          </div>
        `;}).join('')}
      </div>
    `;
  }

  root.innerHTML = `
    <div class="section" style="padding-top:14px;">
      <div class="card" id="desglose-endeudamiento-card" style="padding:14px;margin-bottom:14px;"></div>
      <p style="font-size:12px;color:var(--ink-faint);margin:0 0 14px;">Proyección de tus gastos fijos e impuestos mes a mes, incluyendo las cuotas de préstamos hasta que terminen de pagarse. Los del mes actual puedes marcarlos como pagados tocándolos.</p>
      ${monthsHTML}
      ${hasMore ? `<button class="btn-secondary" id="desglose-ver-mas" style="width:100%;">Ver más meses</button>` : ''}
    </div>
  `;
  document.getElementById('view-root').replaceChildren(root);

  const debtLoadNow = state.debts.filter(d=>Number(d.remaining||0)>0).reduce((s,d)=>s+Number(d.monthlyPayment||0),0);
  const otherFixedNow = state.fixedExpenses.filter(fe=>!fe.debtId && isDueThisMonth(fe)).reduce((s,fe)=>s+Number(fe.amount||0),0);
  const dNow = getUsefulSimData();
  const endCard = root.querySelector('#desglose-endeudamiento-card');
  if(dNow.income<=0){
    endCard.innerHTML = `<div style="font-size:12.5px;color:var(--ink-faint);">Registra algún ingreso este mes para calcular tu tasa de endeudamiento.</div>`;
  } else {
    const ratio = Math.round((debtLoadNow/dNow.income)*100);
    const level = ratio>=35 ? {color:'var(--expense)', bg:'var(--expense-bg)', label:'Alta'} : ratio>=20 ? {color:'var(--gold)', bg:'var(--paper-card-2)', label:'Moderada'} : {color:'var(--income)', bg:'var(--income-bg)', label:'Saludable'};
    endCard.style.background = level.bg;
    endCard.style.borderColor = level.color;

    const totalCommitted = debtLoadNow + otherFixedNow;
    const totalRatio = Math.round((totalCommitted/dNow.income)*100);
    const necesidadTarget = getBudgetRule().necesidad;
    const totalOver = totalRatio>necesidadTarget;

    endCard.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);">Tasa de endeudamiento (solo deudas)</span>
        <span style="font-size:11px;font-weight:700;color:${level.color};">${level.label}</span>
      </div>
      <div style="font-family:'Fraunces',serif;font-size:28px;font-weight:600;color:${level.color};margin-bottom:6px;">${ratio}%</div>
      <div style="font-size:12px;color:var(--ink-soft);">${fmt(debtLoadNow)} €/mes en deudas sobre ${fmt(dNow.income)} €/mes de ingresos estimados.</div>
      <div style="height:8px;background:var(--paper-card-2);border-radius:5px;border:1px solid var(--line);overflow:hidden;margin-top:8px;">
        <div style="height:100%;width:${Math.min(100,ratio)}%;background:${level.color};border-radius:5px;"></div>
      </div>
      <div style="font-size:11px;color:var(--ink-faint);margin-top:6px;margin-bottom:14px;">Por debajo del 20% se considera saludable; a partir del 35% se recomienda no asumir más deuda.</div>

      <div style="border-top:1px solid var(--line);padding-top:12px;">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">
          <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);">Carga total (deudas + gastos fijos)</span>
          <span style="font-size:11px;font-weight:700;color:${totalOver?'var(--expense)':'var(--income)'};">${totalOver?'⚠':'✓'}</span>
        </div>
        <div style="font-family:'Fraunces',serif;font-size:22px;font-weight:600;color:${totalOver?'var(--expense)':'var(--income)'};margin-bottom:6px;">${totalRatio}%</div>
        <div style="font-size:12px;color:var(--ink-soft);">${fmt(totalCommitted)} €/mes comprometidos (deudas + gastos fijos e impuestos) sobre tus ingresos.</div>
        <div style="height:8px;background:var(--paper-card-2);border-radius:5px;border:1px solid var(--line);overflow:hidden;margin-top:8px;">
          <div style="height:100%;width:${Math.min(100,totalRatio)}%;background:${totalOver?'var(--expense)':'var(--income)'};border-radius:5px;"></div>
        </div>
        <div style="font-size:11px;color:var(--ink-faint);margin-top:6px;">Referencia: el tramo de "necesidades" de tu regla de presupuesto está en el ${necesidadTarget}%.</div>
      </div>
    `;
  }

  const verMasBtn = root.querySelector('#desglose-ver-mas');
  if(verMasBtn){
    verMasBtn.onclick = ()=>{
      desgloseVisibleMonths += 12;
      render();
    };
  }

  root.querySelectorAll('[data-desglose-fe]').forEach(row=>{
    row.onclick = async ()=>{
      const fe = state.fixedExpenses.find(x=>x.id===row.dataset.desgloseFe);
      if(!fe) return;
      if(fixedPaidThisMonth(fe)) await unmarkFixedPaid(fe);
      else await markFixedPaid(fe);
      render();
    };
  });
}

function getNextDueDate(item){
  const todayStr = todayISO();
  const today = new Date();
  for(let i=0;i<36;i++){
    const monthDate = new Date(today.getFullYear(), today.getMonth()+i, 1);
    if(!isDueInMonth(item, monthDate)) continue;
    let day;
    const month = monthDate.getMonth()+1, year = monthDate.getFullYear();
    if(item.frequency && item.frequency!=='mensual' && item.referenceDate){
      day = Number(item.referenceDate.slice(8,10));
    } else {
      day = item.day||1;
    }
    const dateStr = clampDateToValidDay(year, month, day);
    if(dateStr < todayStr) continue;
    const periodKey = periodKeyForFixed(item, dateStr);
    if((item.paidMonths||[]).includes(periodKey)) continue;
    return dateStr;
  }
  return null;
}

function periodKeyForFixed(fe, dateISO){
  const d = new Date(dateISO+'T00:00:00');
  const y = d.getFullYear(), m = d.getMonth();
  switch(fe.frequency){
    case 'semanal': {
      const onejan = new Date(y,0,1);
      const week = Math.ceil((((d-onejan)/86400000) + onejan.getDay()+1)/7);
      return `${y}-S${week}`;
    }
    case 'quincenal': {
      const half = d.getDate()<=15 ? 'A':'B';
      return `${y}-${String(m+1).padStart(2,'0')}-${half}`;
    }
    case 'trimestral': {
      const q = Math.floor(m/3)+1;
      return `${y}-Q${q}`;
    }
    case 'semestral': {
      const h = m<6 ? 1 : 2;
      return `${y}-H${h}`;
    }
    case 'anual':
      return `${y}`;
    case 'mensual':
    default:
      return `${y}-${String(m+1).padStart(2,'0')}`;
  }
}
const FREQ_LABELS = { semanal:'Semanal', quincenal:'Quincenal', mensual:'Mensual', trimestral:'Trimestral', semestral:'Semestral', anual:'Anual' };

function fixedPaidThisMonth(fe){
  const now = periodKeyForFixed(fe, todayISO());
  return (fe.paidMonths||[]).includes(now);
}
function fixedTxIdThisMonth(fe){
  const now = periodKeyForFixed(fe, todayISO());
  return (fe.paidTxByMonth && fe.paidTxByMonth[now]) || null;
}
function lastDayOfMonth(year, month1based){
  return new Date(year, month1based, 0).getDate();
}
function clampDateToValidDay(year, month1based, day){
  const maxDay = lastDayOfMonth(year, month1based);
  const d = Math.min(day, maxDay);
  return `${year}-${String(month1based).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

async function markFixedPaid(fe){
  const now = periodKeyForFixed(fe, todayISO());
  let date;
  const [ty, tm] = todayISO().split('-').map(Number);
  if(fe.referenceDate){
    const refMonth = Number(fe.referenceDate.slice(5,7));
    const refDay = Number(fe.referenceDate.slice(8,10));
    date = clampDateToValidDay(ty, refMonth, refDay);
  } else {
    date = clampDateToValidDay(ty, tm, fe.day||1);
  }
  const txId = uid();
  state.transactions.push({
    id: txId, type:'gasto', account: fe.account, amount: fe.amount, date,
    category: fe.category, note: `Gasto fijo: ${fe.name}`
  });
  fe.paidMonths = fe.paidMonths || [];
  fe.paidMonths.push(now);
  fe.paidTxByMonth = fe.paidTxByMonth || {};
  fe.paidTxByMonth[now] = txId;
  if(fe.debtId){
    const debt = state.debts.find(x=>x.id===fe.debtId);
    if(debt){
      fe.debtSnapshotByMonth = fe.debtSnapshotByMonth || {};
      fe.debtSnapshotByMonth[now] = { remaining: debt.remaining, interestPaid: debt.interestPaid||0 };
      registerDebtPayment(debt, fe.amount);
    }
  }
  if(fe.goalId){
    const goal = state.goals.find(x=>x.id===fe.goalId);
    if(goal){
      fe.goalSnapshotByMonth = fe.goalSnapshotByMonth || {};
      fe.goalSnapshotByMonth[now] = { current: goal.current };
      goal.current = Math.round((goal.current - fe.amount)*100)/100;
    }
  }
  await saveState();
}
async function unmarkFixedPaid(fe){
  const now = periodKeyForFixed(fe, todayISO());
  const txId = fixedTxIdThisMonth(fe);
  if(txId) state.transactions = state.transactions.filter(t=>t.id!==txId);
  fe.paidMonths = (fe.paidMonths||[]).filter(m=>m!==now);
  if(fe.paidTxByMonth) delete fe.paidTxByMonth[now];
  if(fe.debtId && fe.debtSnapshotByMonth && fe.debtSnapshotByMonth[now]){
    const debt = state.debts.find(x=>x.id===fe.debtId);
    if(debt){
      const snap = fe.debtSnapshotByMonth[now];
      debt.remaining = snap.remaining;
      debt.interestPaid = snap.interestPaid;
      recordDebtHistory(debt);
    }
    delete fe.debtSnapshotByMonth[now];
  }
  if(fe.goalId && fe.goalSnapshotByMonth && fe.goalSnapshotByMonth[now]){
    const goal = state.goals.find(x=>x.id===fe.goalId);
    if(goal){
      const snap = fe.goalSnapshotByMonth[now];
      goal.current = snap.current;
    }
    delete fe.goalSnapshotByMonth[now];
  }

function isDueInMonth(fe, targetMonthDate){
  const targetMonthIndex = targetMonthDate.getFullYear()*12 + targetMonthDate.getMonth();
  if(fe.endDate){
    const end = new Date(fe.endDate+'T00:00:00');
    const endMonthIndex = end.getFullYear()*12 + end.getMonth();
    if(targetMonthIndex>endMonthIndex) return false;
  }
  const freq = fe.frequency || 'mensual';
  if(freq==='mensual' || freq==='quincenal' || freq==='semanal') return true;
  if(!fe.referenceDate) return true;
  const ref = new Date(fe.referenceDate+'T00:00:00');
  const refMonthIndex = ref.getFullYear()*12 + ref.getMonth();
  const diff = targetMonthIndex - refMonthIndex;
  const interval = freq==='trimestral' ? 3 : freq==='semestral' ? 6 : freq==='anual' ? 12 : 1;
  if(diff<0) return false;
  return diff % interval === 0;
}
function isDueThisMonth(fe){
  return isDueInMonth(fe, new Date());
}

async function markFixedIncomePaid(fi){
  const now = periodKeyForFixed(fi, todayISO());
  const [ty, tm] = todayISO().split('-').map(Number);
  let date;
  if(fi.referenceDate){
    const refMonth = Number(fi.referenceDate.slice(5,7));
    const refDay = Number(fi.referenceDate.slice(8,10));
    date = clampDateToValidDay(ty, refMonth, refDay);
  } else {
    date = clampDateToValidDay(ty, tm, fi.day||1);
  }
  const txId = uid();
  state.transactions.push({
    id: txId, type:'ingreso', account: fi.account, amount: fi.amount, date,
    incomeType: fi.incomeType, note: `Ingreso fijo: ${fi.name}`
  });
  fi.paidMonths = fi.paidMonths || [];
  fi.paidMonths.push(now);
  fi.paidTxByMonth = fi.paidTxByMonth || {};
  fi.paidTxByMonth[now] = txId;
  await saveState();
}

}

function baselineInterestNow(d){
  const baseStart = d.startDate || (d.history && d.history[0] ? d.history[0].date : todayISO());
  const monthlyRate = Number(d.interestRate||0)/100/12;
  if(!(d.total>0) || !(d.monthlyPayment>0) || monthlyRate<=0) return 0;
  const monthsFromStart = monthsBetween(baseStart, todayISO());
  return simulateHistoricalInterest(d.total, d.monthlyPayment, monthlyRate, monthsFromStart, d.termMonths).interestPaid;
}

function openAdjustBalanceSheet(accountName, parentWrap){
  const currentBal = getAccountBalance(accountName);
  const overlay = document.createElement('div');
  overlay.className='overlay';
  overlay.innerHTML = `
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h3>Ajustar saldo · ${accountName}</h3>
      <p style="font-size:12px;color:var(--ink-faint);margin:0 0 14px;">Saldo calculado ahora mismo: <strong style="color:var(--ink);">${fmt(currentBal)} €</strong>. Indica el saldo real que tiene esta cuenta y la app añadirá un movimiento de ajuste con la diferencia.</p>
      <div class="field"><label>Saldo real (€)</label><input type="text" inputmode="decimal" id="adj-balance" value="${fmt(currentBal)}"></div>
      <div class="sheet-actions"><button class="btn-primary" id="adj-save" style="flex:1;">Ajustar</button></div>
    </div>
  `;
  document.getElementById('modal-root').appendChild(overlay);
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  attachAmountFormatting(overlay.querySelector('#adj-balance'));
  overlay.querySelector('#adj-save').onclick = async ()=>{
    const real = parseAmount(overlay.querySelector('#adj-balance').value);
    if(real===null || isNaN(real)){ showToast('Introduce un saldo válido.'); return; }
    const diff = Math.round((real - currentBal)*100)/100;
    if(diff===0){ showToast('El saldo ya coincide, no hace falta ajustar.'); overlay.remove(); return; }
    const type = diff>0 ? 'ingreso' : 'gasto';
    const label = 'Ajuste de saldo';
    if(type==='ingreso' && !state.incomeTypes.includes(label)) state.incomeTypes.push(label);
    if(type==='gasto' && !state.categories.includes(label)) state.categories.push(label);
    state.transactions.push({
      id: uid(), type, account: accountName, amount: Math.abs(diff), date: todayISO(),
      category: type==='gasto'? label : undefined,
      incomeType: type==='ingreso'? label : undefined,
      note: 'Ajuste manual de saldo', isAdjustment: true
    });
    await saveState();
    overlay.remove();
    showToast('Saldo ajustado.');
    if(parentWrap) renderAccountsMoneyList(parentWrap);
  };
}

function getUsefulSimData(){
  const t = totals();
  const excludedAccounts = getBalanceExcludedAccounts();
  const debtLoad = state.debts.filter(d=>Number(d.remaining||0)>0).reduce((s,d)=>s+Number(d.monthlyPayment||0),0);
  const fixedIncomeMonthly = (state.fixedIncomes||[]).filter(fi=>(!fi.frequency || fi.frequency==='mensual') && !excludedAccounts.has(fi.account)).reduce((s,fi)=>s+Number(fi.amount||0),0);
  const estIncome = fixedIncomeMonthly>0 ? fixedIncomeMonthly : t.monthIncome;
  return {
    income: estIncome,
    balance: t.balance,
    debtLoad,
    savingsCapacity: Math.max(0, estIncome - t.monthExpense)
  };
}

function renderEndeudamientoNote(income, debtLoad, newLimitPct){
  const HEALTHY_TOTAL = 35;
  if(income<=0){
    return `<p style="font-size:12px;color:var(--ink-faint);margin:-6px 0 16px;">No hay ingresos registrados este mes todavía, así que no se puede calcular tu tasa de endeudamiento actual.</p>`;
  }
  const otherFixed = state.fixedExpenses.filter(fe=>!fe.debtId && isDueThisMonth(fe)).reduce((s,fe)=>s+Number(fe.amount||0),0);
  const totalCommitted = debtLoad + otherFixed;
  const currentRatio = Math.round((debtLoad/income)*100);
  const totalRatio = Math.round((totalCommitted/income)*100);
  const combinedRatio = totalRatio + newLimitPct;
  const overHealthy = combinedRatio > HEALTHY_TOTAL;
  if(totalCommitted<=0){
    return `<p style="font-size:12px;color:var(--income);margin:-6px 0 16px;">✓ Actualmente no tienes deudas ni gastos fijos registrados, así que partes con margen para asumir esta cuota.</p>`;
  }
  return `<div style="background:${overHealthy?'var(--expense-bg)':'var(--income-bg)'};border:1px solid ${overHealthy?'var(--expense)':'var(--income)'};border-radius:9px;padding:9px 11px;margin:-6px 0 16px;">
    <div style="font-size:12px;color:${overHealthy?'var(--expense)':'var(--ink-soft)'};margin-bottom:3px;">Ya destinas el <strong>${currentRatio}%</strong> a deudas (${fmt(debtLoad)} €/mes) y el <strong>${totalRatio}%</strong> en total sumando el resto de gastos fijos (${fmt(totalCommitted)} €/mes).</div>
    <div style="font-size:12px;color:${overHealthy?'var(--expense)':'var(--income)'};font-weight:600;">${overHealthy?'⚠':'✓'} Sumando esta cuota nueva, tu compromiso mensual total rondaría el ${combinedRatio}% ${overHealthy? `(por encima del ${HEALTHY_TOTAL}% recomendado como techo global)` : '(dentro de un nivel saludable)'}.</div>
  </div>`;
}

function monthsBetween(startISO, endISO){
  const s = new Date(startISO+'T00:00:00'), e = new Date(endISO+'T00:00:00');
  return Math.max(0, (e.getFullYear()-s.getFullYear())*12 + (e.getMonth()-s.getMonth()));
}
function estimateMonthsRemaining(debt){
  if(debt.termMonths && debt.termMonths>0){
    const elapsed = debt.startDate ? monthsBetween(debt.startDate, todayISO()) : 0;
    return Math.max(1, debt.termMonths - elapsed);
  }
  if(debt.monthlyPayment>0){
    return Math.max(1, Math.ceil(debt.remaining/debt.monthlyPayment));
  }
  return 12;
}
function rebuildDebtSchedule(debt){
  if(!debt.startDate || !(debt.total>0) || !(debt.monthlyPayment>0)){
    return;
  }
  const monthlyRate = Number(debt.interestRate||0)/100/12;
  const monthsElapsed = monthsBetween(debt.startDate, todayISO());
  const maxMonths = debt.termMonths>0 ? Math.min(monthsElapsed, debt.termMonths) : monthsElapsed;
  const manual = debt.manualAmortizations || {};
  let balance = debt.total, interestAccum = 0, paidAccum = 0, savedAccum = 0;
  const hist = [{ date: debt.startDate, remaining: balance, totalPaid: 0, interestPaid: 0, interestSaved: 0 }];

  const startKey = debt.startDate.slice(0,7);
  const extraStart = Number(manual[startKey]||0);
  if(extraStart>0 && balance>0.01){
    const applied = Math.min(extraStart, balance);
    const monthsRemainingAtStart = debt.termMonths>0 ? Math.max(1, debt.termMonths) : Math.max(1, Math.ceil(balance/debt.monthlyPayment));
    const saved = Math.round((applied*monthlyRate*monthsRemainingAtStart)*100)/100;
    savedAccum = Math.round((savedAccum+saved)*100)/100;
    paidAccum = Math.round((paidAccum+applied)*100)/100;
    balance = Math.round((balance-applied)*100)/100;
    hist[0] = { date: debt.startDate, remaining: balance, totalPaid: paidAccum, interestPaid: interestAccum, interestSaved: savedAccum };
  }

  for(let i=1;i<=maxMonths && balance>0.01;i++){
    const interest = Math.round(balance*monthlyRate*100)/100;
    let principal = debt.monthlyPayment - interest;
    if(principal<0) principal = 0;
    if(principal>balance) principal = balance;
    interestAccum = Math.round((interestAccum+interest)*100)/100;
    paidAccum = Math.round((paidAccum+debt.monthlyPayment)*100)/100;
    balance = Math.round((balance-principal)*100)/100;

    const dt = new Date(debt.startDate+'T00:00:00');
    dt.setMonth(dt.getMonth()+i);
    const mKey = dt.toISOString().slice(0,7);
    const extra = Number(manual[mKey]||0);
    if(extra>0 && balance>0.01){
      const applied = Math.min(extra, balance);
      const monthsRemainingAtPoint = debt.termMonths>0 ? Math.max(1, debt.termMonths-i) : Math.max(1, Math.ceil(balance/debt.monthlyPayment));
      const saved = Math.round((applied*monthlyRate*monthsRemainingAtPoint)*100)/100;
      savedAccum = Math.round((savedAccum+saved)*100)/100;
      paidAccum = Math.round((paidAccum+applied)*100)/100;
      balance = Math.round((balance-applied)*100)/100;
    }
    hist.push({ date: dt.toISOString().slice(0,10), remaining: balance, totalPaid: paidAccum, interestPaid: interestAccum, interestSaved: savedAccum });
  }
  debt.remaining = balance;
  debt.interestPaid = interestAccum;
  debt.interestSaved = savedAccum;
  debt.totalPaidAccum = paidAccum;
  debt.history = hist;
  maybeArchiveDebtIfPaid(debt);
}

function simulateHistoricalInterest(total, monthlyPayment, monthlyRate, monthsElapsed, termMonths){
  let balance = total, interestPaid = 0;
  const maxMonths = (termMonths && termMonths>0) ? Math.min(monthsElapsed, termMonths) : monthsElapsed;
  for(let i=0;i<maxMonths && balance>0.01;i++){
    const interest = Math.round(balance*monthlyRate*100)/100;
    let principal = monthlyPayment - interest;
    if(principal<0) principal = 0;
    if(principal>balance) principal = balance;
    interestPaid = Math.round((interestPaid+interest)*100)/100;
    balance = Math.round((balance-principal)*100)/100;
  }
  return { interestPaid, balanceAfter: balance };
}

function seedDebtHistory(debtRef){
  if(!debtRef.startDate || !(debtRef.interestRate>0) || !(debtRef.monthlyPayment>0) || !(debtRef.total>0)){
    recordDebtHistory(debtRef);
    return;
  }
  const monthlyRate = debtRef.interestRate/100/12;
  const monthsElapsed = monthsBetween(debtRef.startDate, todayISO());
  const maxMonths = debtRef.termMonths>0 ? Math.min(monthsElapsed, debtRef.termMonths) : monthsElapsed;
  let balance = debtRef.total, interestAccum = 0, paidAccum = 0;
  const hist = [{ date: debtRef.startDate, remaining: balance, totalPaid: 0, interestPaid: 0, interestSaved: 0 }];
  for(let i=1;i<=maxMonths && balance>0.01;i++){
    const interest = Math.round(balance*monthlyRate*100)/100;
    let principal = debtRef.monthlyPayment - interest;
    if(principal<0) principal = 0;
    if(principal>balance) principal = balance;
    interestAccum = Math.round((interestAccum+interest)*100)/100;
    paidAccum = Math.round((paidAccum+debtRef.monthlyPayment)*100)/100;
    balance = Math.round((balance-principal)*100)/100;
    const d = new Date(debtRef.startDate+'T00:00:00');
    d.setMonth(d.getMonth()+i);
    hist.push({ date: d.toISOString().slice(0,10), remaining: balance, totalPaid: paidAccum, interestPaid: interestAccum, interestSaved: 0 });
  }
  debtRef.history = hist;
  debtRef.totalPaidAccum = paidAccum;
  debtRef.interestPaid = interestAccum;
}

function recordDebtHistory(debt){
  debt.history = debt.history || [];
  const today = todayISO();
  const point = { date: today, remaining: debt.remaining, totalPaid: debt.totalPaidAccum||0, interestPaid: debt.interestPaid||0, interestSaved: debt.interestSaved||0 };
  const last = debt.history[debt.history.length-1];
  if(last && last.date===today){ Object.assign(last, point); }
  else { debt.history.push(point); }
}

function maybeArchiveDebtIfPaid(debt){
  if(Number(debt.remaining||0)<=0){
    state.fixedExpenses = state.fixedExpenses.filter(fe=>fe.debtId!==debt.id);
  }
}

function registerDebtPayment(debt, paymentAmount){
  const balanceBefore = debt.remaining;
  const monthlyRate = Number(debt.interestRate||0)/100/12;
  const interestPortion = Math.min(paymentAmount, Math.round(balanceBefore*monthlyRate*100)/100);
  const principalPortion = Math.round((paymentAmount - interestPortion)*100)/100;

  debt.interestPaid = Math.round(((debt.interestPaid||0) + interestPortion)*100)/100;
  debt.totalPaidAccum = Math.round(((debt.totalPaidAccum||0) + paymentAmount)*100)/100;
  debt.remaining = Math.max(0, Math.round((balanceBefore - principalPortion)*100)/100);
  recordDebtHistory(debt);
  maybeArchiveDebtIfPaid(debt);
}

function openAmortizacionSheet(id){
  const d = state.debts.find(x=>x.id===id);

  const overlay = document.createElement('div');
  overlay.className='overlay';
  overlay.innerHTML = `
    <div class="sheet">
      <div class="sheet-handle"></div>
