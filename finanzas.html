      <div class="field">
        <label>Aplicar la amortización a</label>
        <select id="am-mode">
          <option value="plazo">Reducir plazo (misma cuota, terminas antes)</option>
          <option value="cuota">Reducir cuota (mismo plazo, pagas menos cada mes)</option>
        </select>
      </div>
      ${hasFee ? `<p id="am-fee-preview" style="font-size:12px;color:var(--expense);margin:-6px 0 16px;">Comisión de cancelación estimada: 0,00 €</p>` : `<p style="font-size:12px;color:var(--ink-faint);margin:-6px 0 16px;">Este préstamo no tiene comisión de cancelación configurada.</p>`}
      <p style="font-size:12px;color:var(--ink-faint);margin:0 0 16px;">El importe se descuenta directamente del saldo pendiente (no de la cuota) y calcula el interés que te ahorras.</p>
      <div class="sheet-actions"><button class="btn-primary" id="am-save">Registrar amortización</button></div>
    </div>
  `;
  document.getElementById('modal-root').appendChild(overlay);
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  const amountInput = overlay.querySelector('#am-amount');
  attachAmountFormatting(amountInput);

  if(hasFee){
    const feePreview = overlay.querySelector('#am-fee-preview');
    const updatePreview = ()=>{
      const amt = parseAmount(amountInput.value)||0;
      const fee = calcCancelFee(d, amt);
      feePreview.textContent = `Comisión de cancelación estimada: ${fmt(fee)} € (se añadirá como gasto aparte)`;
    };
    amountInput.addEventListener('input', updatePreview);
    updatePreview();
  }

  overlay.querySelector('#am-save').onclick = async ()=>{
    const amount = parseAmount(amountInput.value);
    const mode = overlay.querySelector('#am-mode').value;
    if(!amount || amount<=0){ showToast('Introduce un importe válido.'); return; }
    if(amount > d.remaining){ showToast('El importe no puede superar el saldo pendiente.'); return; }
    const fee = calcCancelFee(d, amount);
    registerAmortizacion(d, amount, mode);
    if(!state.categories.includes('Amortización de deuda')){
      state.categories.push('Amortización de deuda');
      state.categoryTypes = state.categoryTypes || {};
      state.categoryTypes['Amortización de deuda'] = 'ahorro';
    }
    state.transactions.push({
      id: uid(), type:'gasto', account: d.account || state.accounts[0], amount: amount,
      date: todayISO(), category: 'Amortización de deuda', note: `Amortización: ${d.name}`
    });
    if(fee>0){
      state.transactions.push({
        id: uid(), type:'gasto', account: d.account || state.accounts[0], amount: fee,
        date: todayISO(), category: (state.categories.includes('Comisiones bancarias')? 'Comisiones bancarias' : state.categories[0]),
        note: `Comisión de cancelación: ${d.name}`
      });
    }
    await saveState(); overlay.remove(); render();
    showToast(fee>0? `Amortización registrada (comisión ${fmt(fee)} €).` : 'Amortización registrada.');
  };
}

function calcCancelFee(debt, amount){
  const pct = Number(debt.cancelFeePercent||0);
  if(pct<=0 || !amount) return 0;
  const base = debt.cancelFeeBase==='pendiente' ? debt.remaining : amount;
  return Math.round((base * pct/100)*100)/100;
}

function calcMonthlyPaymentAnnuity(principal, monthlyRate, months){
  if(months<=0) return 0;
  if(monthlyRate<=0) return principal/months;
  return principal * monthlyRate / (1 - Math.pow(1+monthlyRate, -months));
}

function solveAnnualRateFromPayment(principal, payment, months){
  if(principal<=0 || months<=0 || payment<=0) return 0;
  if(payment*months <= principal) return 0;
  let lo = 0, hi = 100;
  for(let i=0;i<60;i++){
    const mid = (lo+hi)/2;
    const monthlyRate = mid/100/12;
    const calcPayment = calcMonthlyPaymentAnnuity(principal, monthlyRate, months);
    if(calcPayment>payment) hi=mid; else lo=mid;
  }
  return Math.round(((lo+hi)/2)*100)/100;
}

function registerAmortizacion(debt, amount, mode){
  mode = mode || 'plazo';
  const monthlyRate = Number(debt.interestRate||0)/100/12;
  const monthsRemaining = estimateMonthsRemaining(debt);
  const savedEstimate = Math.round((amount * monthlyRate * monthsRemaining)*100)/100;
  debt.interestSaved = Math.round(((debt.interestSaved||0) + savedEstimate)*100)/100;
  debt.totalPaidAccum = Math.round(((debt.totalPaidAccum||0) + amount)*100)/100;
  debt.remaining = Math.max(0, Math.round((debt.remaining - amount)*100)/100);
  if(mode==='cuota' && debt.remaining>0 && monthsRemaining>0){
    const newPayment = calcMonthlyPaymentAnnuity(debt.remaining, monthlyRate, monthsRemaining);
    debt.monthlyPayment = Math.round(newPayment*100)/100;
    const fe = state.fixedExpenses.find(x=>x.debtId===debt.id);
    if(fe) fe.amount = debt.monthlyPayment;
  }
  recordDebtHistory(debt);
  maybeArchiveDebtIfPaid(debt);
}

    title: 'Regla 20/4/10 (comprar un coche)',

      <p style="margin:0;">Los bancos suelen financiar como máximo el 80% del valor de tasación, así que conviene tener ahorrado ese 20% restante más un 10-15% extra para gastos (notaría, registro, impuestos).</p>

function renderEmergencyGoalStatus(wrap){
  if(!wrap) return;
  const goalBefore = state.goals.find(g=>g.isEmergencyFund)?.target;
  const goal = getEmergencyFundGoal();
  if(goal && goal.target!==goalBefore) saveState();
  if(!goal){
    wrap.innerHTML = `
      <p style="font-size:12px;color:var(--ink-faint);margin:0 0 10px;">Puedes crear una meta de ahorro dedicada al fondo de emergencia, con el objetivo recomendado ya calculado, para hacer seguimiento más preciso.</p>
      <button class="btn-secondary" id="ef-create-goal" style="width:100%;">Crear meta de fondo de emergencia</button>
    `;
    wrap.querySelector('#ef-create-goal').onclick = async ()=>{
      const avgExpense = getAverageMonthlyExpense();
      const target = avgExpense>0 ? Math.round(avgExpense*6*100)/100 : 1000;
      state.goals.push({id:uid(), name:'Fondo de emergencia', target, current:0, isEmergencyFund:true});
      await saveState();
      renderEmergencyGoalStatus(wrap);
      showToast('Meta de fondo de emergencia creada.');
    };
  } else {
    const mergedTotal = getEmergencyFundSavedTotal();
    const pct = goal.target>0 ? Math.min(100, Math.round((mergedTotal/goal.target)*100)) : 0;
    const hasLink = !!goal.linkedAccount;
    wrap.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">
        <span style="font-size:13px;font-weight:600;">Meta vinculada: "${goal.name}"</span>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);">${fmt(mergedTotal)} / ${fmt(goal.target)} €</span>
      </div>
      <div style="height:8px;background:var(--paper-card-2);border-radius:5px;border:1px solid var(--line);overflow:hidden;">
        <div style="height:100%;width:${pct}%;background:var(--gold);border-radius:5px;"></div>
      </div>
      ${hasLink ? `<div style="font-size:11px;color:var(--ink-faint);margin-top:6px;">Meta: ${fmt(goal.current)} € + Cuenta "${goal.linkedAccount}": ${fmt(getAccountBalance(goal.linkedAccount))} €</div>` : ''}
      <p style="font-size:11.5px;color:var(--ink-faint);margin-top:8px;margin-bottom:14px;">Se usa esta meta para calcular tu progreso del fondo de emergencia. Gestiónala desde la pestaña Metas.</p>
      <div style="border-top:1px solid var(--line);padding-top:14px;">
        <div class="field" style="margin-bottom:${hasLink?'10px':'0'};">
          <label>Vincular a una cuenta (opcional)</label>
          <select id="ef-link-account">
            <option value="">Ninguna</option>
            ${state.accounts.map(a=>`<option value="${a}" ${goal.linkedAccount===a?'selected':''}>${a}</option>`).join('')}
          </select>
        </div>
        ${hasLink ? `
        <label style="display:flex;align-items:center;gap:10px;cursor:pointer;">
          <input type="checkbox" id="ef-exclude-balance" ${goal.excludeFromBalance?'checked':''} style="width:18px;height:18px;">
          <span style="font-size:13px;">No mostrar esta cuenta en el balance total</span>
        </label>
        <p style="font-size:11px;color:var(--ink-faint);margin:6px 0 0 28px;">El saldo de "${goal.linkedAccount}" seguirá contando en tu patrimonio neto y en el fondo de emergencia, solo se resta del balance total.</p>` : ''}
      </div>
    `;
    wrap.querySelector('#ef-link-account').onchange = async (e)=>{
      goal.linkedAccount = e.target.value || null;
      if(!goal.linkedAccount) goal.excludeFromBalance = false;
      await saveState();
      renderEmergencyGoalStatus(wrap);
    };
    if(hasLink){
      wrap.querySelector('#ef-exclude-balance').onchange = async (e)=>{
        goal.excludeFromBalance = e.target.checked;
        await saveState();
        renderEmergencyGoalStatus(wrap);
      };
    }
  }
}

function renderAccountRatesRows(wrap){
  if(!wrap) return;
  state.accountRates = state.accountRates || {};
  if(state.accounts.length===0){
    wrap.innerHTML = `<div style="font-size:12px;color:var(--ink-faint);">Añade primero alguna cuenta arriba.</div>`;
    return;
  }
  wrap.innerHTML='';
  state.accounts.forEach(acc=>{
    const field = document.createElement('div');
    field.className='field';
    const val = state.accountRates[acc] ? state.accountRates[acc] : '';
    field.innerHTML = `<label>${acc} — TAE (%)</label><input type="number" step="0.01" min="0" data-acc-rate="${acc}" value="${val}" placeholder="Sin remunerar">`;
    wrap.appendChild(field);
    const input = field.querySelector('input');
    input.addEventListener('change', async ()=>{
      const v = parseFloat(input.value.replace(',','.'));
      state.accountRates = state.accountRates || {};
      if(v>0){ state.accountRates[acc] = v; }
      else { delete state.accountRates[acc]; input.value=''; }
      await saveState();
    });
  });
}

function applyTheme(themeId){
  const t = THEMES[themeId] || THEMES.clasico;
  Object.entries(t.vars).forEach(([k,v])=> document.documentElement.style.setProperty(k,v));
}

function openBudgetRuleSheet(){
  const br = getBudgetRule();
  const overlay = document.createElement('div');
  overlay.className='overlay';
  overlay.innerHTML = `
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h3>Editar regla 50/30/20</h3>
      <div style="display:flex;align-items:flex-start;gap:8px;background:var(--expense-bg);border:1px solid var(--expense);border-radius:9px;padding:10px 12px;margin-bottom:16px;">
        <span style="font-size:15px;">⚠</span>
        <span style="font-size:12px;color:var(--expense);line-height:1.4;">La regla 50/30/20 (necesidades/deseos/ahorro) es una recomendación general de planificación financiera, no una norma universal. Ajusta estos porcentajes solo si entiendes bien tu situación económica; los tres valores deben sumar 100%.</span>
      </div>
      <div class="field"><label>Necesidades (%)</label><input type="number" min="0" max="100" id="rule-necesidad" value="${br.necesidad}"></div>
      <div class="field"><label>Deseos (%)</label><input type="number" min="0" max="100" id="rule-deseo" value="${br.deseo}"></div>
      <div class="field"><label>Ahorro (%)</label><input type="number" min="0" max="100" id="rule-ahorro" value="${br.ahorro}"></div>
      <p id="rule-sum-note" style="font-size:12px;color:var(--ink-faint);margin:-6px 0 16px;">Suma actual: ${br.necesidad+br.deseo+br.ahorro}%</p>
      <div class="sheet-actions">
        <button class="btn-secondary" id="rule-reset" style="flex:1;">Restaurar 50/30/20</button>
        <button class="btn-primary" id="rule-save" style="flex:1;">Guardar</button>
      </div>
    </div>
  `;
  document.getElementById('modal-root').appendChild(overlay);
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  const nIn = overlay.querySelector('#rule-necesidad');
  const dIn = overlay.querySelector('#rule-deseo');
  const aIn = overlay.querySelector('#rule-ahorro');
  const sumNote = overlay.querySelector('#rule-sum-note');
  const updateSum = ()=>{
    const sum = (parseInt(nIn.value)||0) + (parseInt(dIn.value)||0) + (parseInt(aIn.value)||0);
    sumNote.textContent = `Suma actual: ${sum}%`;
    sumNote.style.color = sum===100 ? 'var(--ink-faint)' : 'var(--expense)';
  };
  [nIn,dIn,aIn].forEach(inp=> inp.addEventListener('input', updateSum));
  overlay.querySelector('#rule-reset').onclick = ()=>{
    nIn.value=50; dIn.value=30; aIn.value=20; updateSum();
  };
  overlay.querySelector('#rule-save').onclick = async ()=>{
    const necesidad = parseInt(nIn.value)||0;
    const deseo = parseInt(dIn.value)||0;
    const ahorro = parseInt(aIn.value)||0;
    if(necesidad+deseo+ahorro !== 100){ showToast('Los tres porcentajes deben sumar 100%.'); return; }
    state.budgetRule = { necesidad, deseo, ahorro };
    await saveState(); overlay.remove(); render();
    showToast('Regla de presupuesto actualizada.');
  };
}

function exportData(){
  try{
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `finanzas-backup-${todayISO()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    showToast('Copia de seguridad descargada.');
  }catch(e){
    showToast('No se pudo exportar: ' + e.message);
  }
}

function handleImportFile(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    let parsed;
    try{
      parsed = JSON.parse(reader.result);
    }catch(e){
      showToast('El archivo no es un backup válido.');
      return;
    }
    if(typeof parsed!=='object' || parsed===null || !Array.isArray(parsed.transactions)){
      showToast('El archivo no tiene el formato esperado.');
      return;
    }
    openConfirmSheet('Se sustituirán todos los datos actuales de la app por los del archivo importado. Esta acción no se puede deshacer.', async ()=>{
      state = Object.assign({}, JSON.parse(JSON.stringify(DEFAULT_STATE)), parsed);
      await saveState();
      applyTheme(state.theme || 'clasico');
      currentTab = 'resumen';
      render();
      showToast('Datos importados correctamente.');
    }, {title:'Importar datos', confirmLabel:'Importar', danger:true});
  };
  reader.onerror = ()=> showToast('No se pudo leer el archivo.');
  reader.readAsText(file);
}

function wireManageBlock(root, key){
  const chipWrap = root.querySelector(`[data-chips="${key}"]`);
  const isCategories = key==='categories';
  const isAccounts = key==='accounts';
  function renderChips(){
    chipWrap.innerHTML='';
    state[key].forEach(item=>{
      const chip = document.createElement('div');
      chip.className='chip';
      const typeTag = isCategories ? `<button data-tag style="color:${getCategoryType(item)==='necesidad'?'var(--expense)':'var(--gold)'};font-weight:700;">${getCategoryType(item)==='necesidad'?'N':'D'}</button>` : '';
      chip.innerHTML = `${typeTag}<span>${item}</span><button aria-label="Eliminar">×</button>`;
      if(isCategories){
        chip.querySelector('[data-tag]').title = 'Necesidad o Deseo (para la regla 50/30/20). Toca para cambiar.';
        chip.querySelector('[data-tag]').onclick = async ()=>{
          const current = getCategoryType(item);
          state.categoryTypes = state.categoryTypes || {};
          state.categoryTypes[item] = current==='necesidad' ? 'deseo' : 'necesidad';
          await saveState();
          renderChips();
        };
      }
      chip.querySelector('[aria-label="Eliminar"]').onclick = ()=>{
        openConfirmSheet(`¿Eliminar "${item}"? Los movimientos existentes conservarán este valor.`, async ()=>{
          state[key] = state[key].filter(x=>x!==item);
          if(isAccounts && state.accountRates){ delete state.accountRates[item]; }
          await saveState();
          renderChips();
          if(isAccounts) renderAccountRatesRows(root.querySelector('#account-rates-rows'));
        }, {title:'Eliminar', confirmLabel:'Eliminar', danger:true});
      };
      chipWrap.appendChild(chip);
    });
  }
  renderChips();
  const input = root.querySelector(`[data-input="${key}"]`);
  const btn = root.querySelector(`[data-add="${key}"]`);
  async function addItem(){
    const val = input.value.trim();
    if(!val) return;
    if(state[key].includes(val)){ showToast('Ya existe esa entrada.'); return; }
    state[key].push(val);
    input.value='';
    await saveState();
    renderChips();
    if(isAccounts) renderAccountRatesRows(root.querySelector('#account-rates-rows'));
  }
  btn.onclick = addItem;
  input.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); addItem(); } };
}

function openTxSheet(tx){
  const editing = !!tx;
  const type = tx?.type || 'gasto';
  const isTransferEdit = editing && !!tx.isTransfer;
  const pairTx = isTransferEdit ? state.transactions.find(t=>t.id===tx.transferPairId) : null;
  const overlay = document.createElement('div');
  overlay.className='overlay';
  overlay.innerHTML = `
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h3>${editing? 'Editar movimiento' : 'Nuevo movimiento'}</h3>
      <div class="toggle-row">
        <button type="button" data-type="gasto" class="${!isTransferEdit && type==='gasto'?'on expense':''}">Gasto</button>
        <button type="button" data-type="ingreso" class="${!isTransferEdit && type==='ingreso'?'on income':''}">Ingreso</button>
        <button type="button" data-type="transferencia" class="${isTransferEdit?'on transfer':''}">Mover dinero</button>
      </div>
      <div class="field" id="f-account-wrap">
        <label>Cuenta</label>
        <select id="f-account"></select>
        <div class="inline-add"><input id="f-account-new" placeholder="Nueva cuenta…"><button id="f-account-add">Añadir</button></div>
      </div>
      <div class="field" id="f-transfer-from-wrap" style="display:none;">
        <label>Desde</label>
        <select id="f-transfer-from"></select>
      </div>
      <div class="field" id="f-transfer-to-wrap" style="display:none;">
        <label>Hacia</label>
        <select id="f-transfer-to"></select>
      </div>
      <div class="field" id="f-catwrap">
        <label id="f-cat-label">Categoría</label>
        <select id="f-cat"></select>
        <div class="inline-add"><input id="f-cat-new" placeholder="Nueva entrada…"><button id="f-cat-add">Añadir</button></div>
      </div>
      <div class="field">
        <label>Importe (€)</label>
        <input type="text" inputmode="decimal" id="f-amount" placeholder="0,00" value="${tx?.amount!=null ? fmt(tx.amount) : ''}">
      </div>
      <div class="field">
        <label>Fecha</label>
        <input type="date" id="f-date" value="${tx?.date || todayISO()}">
      </div>
      <div class="field">
        <label>Nota (opcional)</label>
        <input type="text" id="f-note" placeholder="Ej. compra semanal" value="${isTransferEdit? '' : (tx?.note || '')}">
      </div>
      <div class="sheet-actions">
        ${editing? '<button class="btn-secondary" id="f-delete">Eliminar</button>':''}
        <button class="btn-primary" id="f-save">${editing? 'Guardar cambios':'Añadir movimiento'}</button>
      </div>
    </div>
  `;
  document.getElementById('modal-root').appendChild(overlay);
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  attachAmountFormatting(overlay.querySelector('#f-amount'));

  let currentType = isTransferEdit ? 'transferencia' : type;
  const accSel = overlay.querySelector('#f-account');
  const catSel = overlay.querySelector('#f-cat');
  const catLabel = overlay.querySelector('#f-cat-label');
  const accountWrap = overlay.querySelector('#f-account-wrap');
  const catWrap = overlay.querySelector('#f-catwrap');
  const fromWrap = overlay.querySelector('#f-transfer-from-wrap');
  const toWrap = overlay.querySelector('#f-transfer-to-wrap');
  const fromSel = overlay.querySelector('#f-transfer-from');
  const toSel = overlay.querySelector('#f-transfer-to');

  function fillAccounts(){
    const accDefault = editing ? tx.account : (state.lastAccount && state.accounts.includes(state.lastAccount) ? state.lastAccount : null);
    accSel.innerHTML = state.accounts.map(a=>`<option value="${a}" ${accDefault===a?'selected':''}>${a}</option>`).join('');
    const fromDefault = isTransferEdit ? tx.account : null;
    const toDefault = isTransferEdit && pairTx ? pairTx.account : null;
    fromSel.innerHTML = state.accounts.map(a=>`<option value="${a}" ${fromDefault===a?'selected':''}>${a}</option>`).join('');
    toSel.innerHTML = state.accounts.map(a=>`<option value="${a}" ${toDefault===a?'selected':''}>${a}</option>`).join('');
  }
  function fillCategory(){
    const list = currentType==='ingreso' ? state.incomeTypes : state.categories;
    catLabel.textContent = currentType==='ingreso' ? 'Tipo de ingreso' : 'Categoría';
    let selected;
    if(editing){
      selected = currentType==='ingreso' ? tx?.incomeType : tx?.category;
    } else {
      const lastVal = currentType==='ingreso' ? state.lastIncomeType : state.lastCategory;
      selected = lastVal && list.includes(lastVal) ? lastVal : null;
    }
    catSel.innerHTML = list.map(c=>`<option value="${c}" ${selected===c?'selected':''}>${c}</option>`).join('');
  }
  function updateFieldVisibility(){
    const isTransfer = currentType==='transferencia';
    accountWrap.style.display = isTransfer? 'none' : 'block';
    catWrap.style.display = isTransfer? 'none' : 'block';
    fromWrap.style.display = isTransfer? 'block' : 'none';
    toWrap.style.display = isTransfer? 'block' : 'none';
  }
  fillAccounts(); fillCategory(); updateFieldVisibility();

  overlay.querySelectorAll('[data-type]').forEach(b=>{
    b.onclick = ()=>{
      currentType = b.dataset.type;
      overlay.querySelectorAll('[data-type]').forEach(x=>x.classList.remove('on','income','expense','transfer'));
      b.classList.add('on', currentType==='ingreso'?'income':currentType==='gasto'?'expense':'transfer');
      fillCategory();
      updateFieldVisibility();
    };
  });

  overlay.querySelector('#f-account-add').onclick = async ()=>{
    const input = overlay.querySelector('#f-account-new');
    const val = input.value.trim();
    if(!val) return;
    if(!state.accounts.includes(val)) state.accounts.push(val);
    await saveState();
    input.value='';
    fillAccounts();
    accSel.value = val;
  };
  overlay.querySelector('#f-cat-add').onclick = async ()=>{
    const input = overlay.querySelector('#f-cat-new');
    const val = input.value.trim();
    if(!val) return;
    const list = currentType==='ingreso' ? state.incomeTypes : state.categories;
    if(!list.includes(val)) list.push(val);
    await saveState();
    input.value='';
    fillCategory();
    catSel.value = val;
  };

  if(editing){
    overlay.querySelector('#f-delete').onclick = ()=>{
      openConfirmSheet(isTransferEdit? '¿Eliminar esta transferencia? Se borrarán los dos movimientos asociados.' : '¿Eliminar este movimiento?', async ()=>{
        state.transactions = state.transactions.filter(t=>t.id!==tx.id && (!isTransferEdit || t.id!==tx.transferPairId));
        await saveState();
        overlay.remove();
        render();
        showToast(isTransferEdit? 'Transferencia eliminada.' : 'Movimiento eliminado.');
      }, {title: isTransferEdit? 'Eliminar transferencia' : 'Eliminar movimiento', confirmLabel:'Eliminar', danger:true});
    };
  }

  const saveBtn = overlay.querySelector('#f-save');
  saveBtn.onclick = async ()=>{
    if(saveBtn.disabled) return;
    const amount = parseAmount(overlay.querySelector('#f-amount').value);
    const date = overlay.querySelector('#f-date').value;
    const note = overlay.querySelector('#f-note').value.trim();
    if(!amount || amount<=0){ showToast('Introduce un importe válido.'); return; }
    if(!date){ showToast('Selecciona una fecha.'); return; }
    saveBtn.disabled = true;

    if(currentType==='transferencia'){
      const from = fromSel.value, to = toSel.value;
      if(!from || !to){ showToast('Selecciona las dos cuentas.'); saveBtn.disabled=false; return; }
      if(from===to){ showToast('Elige dos cuentas distintas.'); saveBtn.disabled=false; return; }
      if(editing && isTransferEdit){
        Object.assign(tx, { type:'gasto', account: from, amount, date, note: note||`Transferencia a ${to}`, isTransfer:true, category:undefined, incomeType:undefined });
        if(pairTx) Object.assign(pairTx, { type:'ingreso', account: to, amount, date, note: note||`Transferencia desde ${from}`, isTransfer:true, category:undefined, incomeType:undefined });
      } else {
        const transferId = uid();
        const id1 = uid(), id2 = uid();
        state.transactions.push({ id:id1, type:'gasto', account:from, amount, date, note: note||`Transferencia a ${to}`, isTransfer:true, transferId, transferPairId:id2 });
        state.transactions.push({ id:id2, type:'ingreso', account:to, amount, date, note: note||`Transferencia desde ${from}`, isTransfer:true, transferId, transferPairId:id1 });
      }
      await saveState();
      overlay.remove();
      render();
      showToast(editing? 'Transferencia actualizada.' : 'Transferencia registrada.');
      return;
    }

    const account = accSel.value;
    const catVal = catSel.value;
    if(!account){ showToast('Selecciona una cuenta.'); saveBtn.disabled=false; return; }
    if(!catVal){ showToast('Selecciona una categoría o tipo de ingreso.'); saveBtn.disabled=false; return; }

    if(editing){
      Object.assign(tx, {
        type: currentType, account, amount, date, note,
        category: currentType==='gasto'? catVal : undefined,
        incomeType: currentType==='ingreso'? catVal : undefined,
        isTransfer: false, transferId: undefined, transferPairId: undefined
      });
    } else {
      state.transactions.push({
        id: uid(), type: currentType, account, amount, date, note,
        category: currentType==='gasto'? catVal : undefined,
        incomeType: currentType==='ingreso'? catVal : undefined,
      });
    }
    state.lastAccount = account;
    if(currentType==='gasto') state.lastCategory = catVal;
    else state.lastIncomeType = catVal;
    await saveState();
    overlay.remove();
    render();
    if(currentType==='gasto'){
      const b = budget503020();
      const br = getBudgetRule();
      const catLimit = (state.categoryBudgets||{})[catVal];
      const catSpent = categoryBreakdown()[catVal] || 0;
      if(catLimit>0 && catSpent>catLimit){
        showToast(`⚠ ${catVal}: ${fmt(catSpent)} € de ${fmt(catLimit)} € este mes`);
      } else if(b.income>0){
        if(b.pctNecesidad>br.necesidad) showToast(`⚠ Necesidades al ${b.pctNecesidad}% (objetivo ${br.necesidad}%)`);
        else if(b.pctDeseo>br.deseo) showToast(`⚠ Deseos al ${b.pctDeseo}% (objetivo ${br.deseo}%)`);
        else if(b.pctAhorro<br.ahorro) showToast(`⚠ Ahorro al ${b.pctAhorro}% (objetivo ${br.ahorro}%)`);
        else showToast(editing? 'Movimiento actualizado.' : 'Movimiento añadido.');
      } else {
        showToast(editing? 'Movimiento actualizado.' : 'Movimiento añadido.');
      }
    } else {
      showToast(editing? 'Movimiento actualizado.' : 'Movimiento añadido.');
    }
  };
}

        </select>
      </div>
      <div class="field" id="d-rate-wrap"><label>Tasa de interés anual (%) — opcional</label><input type="number" step="0.01" min="0" id="d-rate" value="${debt?.interestRate ?? ''}" placeholder="Ej. 6.5"></div>
      <p id="d-rate-computed" style="display:none;font-size:12px;color:var(--ink-soft);margin:-10px 0 16px;"></p>
      <div class="field"><label>¿Tiene comisión de cancelación / amortización anticipada?</label><select id="d-fee-toggle"><option value="0">No</option><option value="1">Sí</option></select></div>
      <div id="d-fee-fields" style="display:none;">
        <div class="field"><label>Comisión (%)</label><input type="number" step="0.01" min="0" id="d-fee-pct" value="${debt?.cancelFeePercent ?? ''}" placeholder="Ej. 0.5"></div>
        <div class="field">
          <label>Se aplica sobre</label>
          <select id="d-fee-base">
            <option value="amortizado">El capital que amortizas cada vez</option>
            <option value="pendiente">El capital pendiente total</option>
          </select>
        </div>
      </div>
      ${!editing? `<p style="font-size:12px;color:var(--ink-faint);margin:-8px 0 16px;">Si rellenas fecha de inicio, importe total, cuota y tasa, calculamos automáticamente los intereses ya pagados en las cuotas anteriores a hoy (suponiendo que has pagado la cuota completa cada mes).</p>` : ''}
      <div class="sheet-actions"><button class="btn-primary" id="d-save">${editing?'Guardar cambios':'Crear deuda'}</button></div>
    </div>
  `;
  document.getElementById('modal-root').appendChild(overlay);
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  overlay.querySelector('#d-account').innerHTML = state.accounts.map(a=>`<option value="${a}" ${debt?.account===a?'selected':''}>${a}</option>`).join('');
  attachAmountFormatting(overlay.querySelector('#d-total'));
  attachAmountFormatting(overlay.querySelector('#d-remaining'));
  attachAmountFormatting(overlay.querySelector('#d-monthly'));

  const rateModeSel = overlay.querySelector('#d-rate-mode');
  const rateWrap = overlay.querySelector('#d-rate-wrap');
  const rateComputed = overlay.querySelector('#d-rate-computed');
  const totalInput = overlay.querySelector('#d-total');
  const monthlyInput = overlay.querySelector('#d-monthly');
  const termInput = overlay.querySelector('#d-term');
  const rateInput = overlay.querySelector('#d-rate');

  function updateComputedRate(){
    const total = parseAmount(totalInput.value)||0;
    const monthly = parseAmount(monthlyInput.value)||0;
    const term = parseInt(termInput.value)||0;
    if(total<=0 || monthly<=0 || term<=0){
      rateComputed.textContent = 'Rellena importe total, cuota mensual y plazo en meses para calcular la tasa.';
      rateComputed.style.color = 'var(--ink-faint)';
      return;
    }
    if(monthly*term <= total){
      rateComputed.textContent = 'La cuota y el plazo indicados no llegan a cubrir el importe total: revisa los datos.';
      rateComputed.style.color = 'var(--expense)';
      return;
    }
    const rate = solveAnnualRateFromPayment(total, monthly, term);
    rateComputed.textContent = `Tasa de interés anual calculada: ${rate}%`;
    rateComputed.style.color = 'var(--ink-soft)';
  }
  function updateRateModeVisibility(){
    const useCuota = rateModeSel.value==='cuota';
    rateWrap.style.display = useCuota ? 'none' : 'block';
    rateComputed.style.display = useCuota ? 'block' : 'none';
    if(useCuota) updateComputedRate();
  }
  rateModeSel.value = 'tasa';
  updateRateModeVisibility();
  rateModeSel.onchange = updateRateModeVisibility;
  [totalInput, monthlyInput, termInput].forEach(inp=>{
    inp.addEventListener('input', ()=>{ if(rateModeSel.value==='cuota') updateComputedRate(); });
  });

  const feeToggle = overlay.querySelector('#d-fee-toggle');
  const feeFields = overlay.querySelector('#d-fee-fields');
  const feeBaseSel = overlay.querySelector('#d-fee-base');
  const hasFee = Number(debt?.cancelFeePercent||0) > 0;
  feeToggle.value = hasFee ? '1' : '0';
  feeFields.style.display = hasFee ? 'block' : 'none';
  feeBaseSel.value = debt?.cancelFeeBase || 'amortizado';
  feeToggle.onchange = ()=>{ feeFields.style.display = feeToggle.value==='1' ? 'block' : 'none'; };
  if(!state.categories.includes('Comisiones bancarias')){
    state.categories.push('Comisiones bancarias');
    state.categoryTypes = state.categoryTypes || {};
    state.categoryTypes['Comisiones bancarias'] = 'necesidad';
  }
  overlay.querySelector('#d-save').onclick = async ()=>{
    const name = overlay.querySelector('#d-name').value.trim();
    const total = parseAmount(overlay.querySelector('#d-total').value);
    const remaining = parseAmount(overlay.querySelector('#d-remaining').value);
    const monthlyPayment = parseAmount(overlay.querySelector('#d-monthly').value)||0;
    const startDate = overlay.querySelector('#d-start').value || '';
    const termMonths = parseInt(overlay.querySelector('#d-term').value)||0;
    let interestRate;
    if(rateModeSel.value==='cuota'){
      if(total<=0 || monthlyPayment<=0 || termMonths<=0){ showToast('Para calcular la tasa a partir de la cuota, indica importe total, cuota mensual y plazo en meses.'); return; }
      if(monthlyPayment*termMonths <= total){ showToast('La cuota y el plazo indicados no llegan a cubrir el importe total.'); return; }
      interestRate = solveAnnualRateFromPayment(total, monthlyPayment, termMonths);
    } else {
      interestRate = parseFloat(overlay.querySelector('#d-rate').value.replace(',','.'))||0;
    }
    const payDay = Math.min(31, Math.max(1, parseInt(overlay.querySelector('#d-payday').value)||1));
    const account = overlay.querySelector('#d-account').value;
    const feeEnabled = feeToggle.value==='1';
    const cancelFeePercent = feeEnabled ? (parseFloat(overlay.querySelector('#d-fee-pct').value.replace(',','.'))||0) : 0;
    const cancelFeeBase = feeBaseSel.value;
    if(!name){ showToast('Ponle un nombre a la deuda.'); return; }
    if(!total || total<=0){ showToast('Introduce un importe total válido.'); return; }
    if(remaining===null || isNaN(remaining) || remaining<0){ showToast('Introduce un saldo pendiente válido.'); return; }
    let debtRef = debt;
    if(editing){
      Object.assign(debt, {name, total, remaining, monthlyPayment, interestRate, startDate, termMonths, payDay, account, cancelFeePercent, cancelFeeBase});
      recordDebtHistory(debt);
    } else {
      debtRef = {id:uid(), name, total, remaining, monthlyPayment, interestRate, startDate, termMonths, payDay, account, cancelFeePercent, cancelFeeBase, interestPaid:0, interestSaved:0, totalPaidAccum:0, history:[]};
      seedDebtHistory(debtRef);
      state.debts.push(debtRef);
      recordDebtHistory(debtRef);
    }
    syncDebtFixedExpense(debtRef);
    await saveState(); overlay.remove(); render();
    showToast(editing?'Deuda actualizada.':'Deuda creada.');
  };
}

function syncDebtFixedExpense(debt){
  let fe = state.fixedExpenses.find(x=>x.debtId===debt.id);
  if(!debt.monthlyPayment || debt.monthlyPayment<=0){
    if(fe) state.fixedExpenses = state.fixedExpenses.filter(x=>x.id!==fe.id);
    return;
  }
  if(!state.categories.includes('Deudas/Préstamos')) state.categories.push('Deudas/Préstamos');
  if(fe){
    fe.name = `Cuota: ${debt.name}`;
    fe.amount = debt.monthlyPayment;
    fe.day = debt.payDay || 1;
    fe.account = debt.account || fe.account;
    fe.category = 'Deudas/Préstamos';
  } else {
    state.fixedExpenses.push({
      id: uid(), name: `Cuota: ${debt.name}`, amount: debt.monthlyPayment, frequency:'mensual',
      day: debt.payDay || 1, category: 'Deudas/Préstamos', account: debt.account || state.accounts[0],
      debtId: debt.id, paidMonths: [], paidTxByMonth: {}, debtSnapshotByMonth: {}
    });
  }
}

/* =========================================================
   RENDER PRINCIPAL
   ========================================================= */
function render(){
  renderTabbar();
  document.getElementById('fab-wrap').style.display = 'flex';
  if(currentTab==='resumen') viewResumen();
  else if(currentTab==='desglose') viewDesglose();
  else if(currentTab==='fijos') viewFijos();
  else if(currentTab==='metas') viewMetas();
  else if(currentTab==='ajustes') viewAjustes();
}

document.getElementById('fab-btn').onclick = ()=> openTxSheet(null);

window.addEventListener('error', (e)=>{
  try{ showToast('Error inesperado: ' + (e.message||'desconocido')); }catch(_){}
});
window.addEventListener('unhandledrejection', (e)=>{
  try{ showToast('Error inesperado: ' + (e.reason && e.reason.message || e.reason || 'desconocido')); }catch(_){}
});

/* =========================================================
   CERRAR HOJAS DESLIZANDO HACIA ABAJO (gesto genérico)
   ========================================================= */
(function setupSheetSwipeToClose(){
  let dragging = null;
  const CLOSE_THRESHOLD = 90;

  function onPointerDown(e){
    const handle = e.target.closest('.sheet-handle');
    if(!handle) return;
    const sheetEl = handle.closest('.sheet');
    const overlayEl = sheetEl ? sheetEl.parentElement : null;
    if(!sheetEl || !overlayEl) return;
    dragging = { sheetEl, overlayEl, startY: e.clientY, currentY: e.clientY };
    sheetEl.style.transition = 'none';
  }
  function onPointerMove(e){
    if(!dragging) return;
    dragging.currentY = e.clientY;
    const delta = Math.max(0, dragging.currentY - dragging.startY);
    dragging.sheetEl.style.transform = `translateY(${delta}px)`;
  }
  function onPointerUp(){
    if(!dragging) return;
    const delta = Math.max(0, dragging.currentY - dragging.startY);
    const { sheetEl, overlayEl } = dragging;
    sheetEl.style.transition = 'transform 0.2s ease';
    if(delta > CLOSE_THRESHOLD){
      sheetEl.style.transform = 'translateY(100%)';
      setTimeout(()=>{ overlayEl.click(); }, 150);
    } else {
      sheetEl.style.transform = '';
    }
    dragging = null;
  }

  document.addEventListener('pointerdown', onPointerDown);
  document.addEventListener('pointermove', onPointerMove);
  document.addEventListener('pointerup', onPointerUp);
  document.addEventListener('pointercancel', onPointerUp);
})();

(async function init(){
  document.getElementById('view-root').innerHTML = '<div style="padding:40px 20px; text-align:center; color:var(--ink-faint); font-size:13px;">Cargando tus datos…</div>';
  await loadState();
  applyTheme(state.theme || 'clasico');
  render();

  let lastKnownDate = todayISO();
  function checkDateChange(){
    const now = todayISO();
    if(now!==lastKnownDate){
      lastKnownDate = now;
      render();
    }
  }
  setInterval(checkDateChange, 60000);
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='visible') checkDateChange();
  });

  if(!hasClaudeStorage && 'serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
</script>
